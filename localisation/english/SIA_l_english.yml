###Parliament GUI###
 SIA_parliament_title: "§YHouse of Representatives of Thailand§!"
 SIA_parliament_house_desc: "The House of Representatives of Thailand\n§YSapha Phuthaen Ratsadon§!\n--------------\n\n\n\n\n£GFX_SIA_Sappaya_Sapasathan\n\n\n\n\n\n\n§YThe House of Representatives of Thailand (Sapha Phuthaen Ratsadon)§! has existed since the 1932 Revolution as the country's legislative chamber, although its existence has not been continuous due to Thailand's history of military coups.\n\nServing as the lower house of §Ythe National Assembly of Thailand§!, the House is composed of 500 seats directly elected by citizens through a dual electoral system consisting of constituency-based elections and party-list proportional representation.\n\nSince August 2019, the meeting place of §Ythe National Assembly of Thailand§! has been §YSappaya-Sapasathan§!, the largest parliamentary complex in the world, located on the eastern bank of the Chao Phraya River in Bangkok.\n--------------\n§GHover over a party's name or the Speaker of the House portrait for information.§!"
 
 SIA_parliament_total_seats_header: "§Y--- Parliamentary Breakdown ---§!"
 SIA_parliament_speaker_header: "§YSpeaker of the House of Representatives§!"
 SIA_parliament_speaker_desc: "§YSpeaker of the House of Representatives§! presides over meetings, maintains order during debates, ensures parliamentary rules are followed, and represents in official duties. The Speaker must act impartially and plays a key role in guiding the legislative process.\n\n§YCurrent Speaker§!: Chuan Leekpai\n\n§YSpeaker Political Party§!: £GFX_democrat §CDemocrat Party§!"

