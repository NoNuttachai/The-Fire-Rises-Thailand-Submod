 SIA_ally_with_workers_union: "Ally with Workers Union"
 SIA_ally_with_workers_union_desc: "They have taken untold millions that they never toiled to earn,\nBut without our brain and muscle not a single wheel can turn.\nWe can break their haughty power, gain our freedom when we learn\nThat the union makes us strong.\n\nSolidarity Forever (song)\n- Ralph Chaplin"
 
 SIA_ladyboys_against_dictatorship: "Ladyboys Against Dictatorship"
 SIA_ladyboys_against_dictatorship_desc: "The fight for LGBTQIA+ rights is inseparable from the struggle against the ruling dictatorship. While those in power claim that Thailand is already an accepting nation, they continue to exploit rigid social norms to keep people divided and distracted from systemic inequality. As long as the junta remains in power, LGBTQIA+ rights will remain out of reach."
 
