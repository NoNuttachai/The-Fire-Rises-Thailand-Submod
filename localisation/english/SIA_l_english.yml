 thai_events.35.t: "The Moment of Truth"
 thai_events.35.d: "Prime Minister Prayut Chan-o-cha, accompanied by his Cabinet, arrived at the National Assembly expecting to survive the no-confidence motion tabled a week prior. However, when the Prime Minister met with government MPs before the vote, an unsettling atmosphere took hold. Something was clearly wrong.\n\nThamanat Prompow, the leader of a powerful faction within the Palang Pracharath Party, signaled his opposition toward General Prayut. This move confirmed the rumors circulating in the media for the past 24 hours that an internal rebellion was brewing and would likely strike on the night of the vote.\n\nAs the voting concluded, the Chamber fell silent in anticipation. Speaker Chuan Leekpai began to read the results:\n\n'With 475 members present: 248 Ayes, 224 Nays, and 3 abstentions. No blank votes. Therefore, the House of Representatives has passed a motion of no confidence against Prime Minister Prayut Chan-o-cha.'\n\nThe Chamber immediately descended into chaos, with government MPs frantically demanding a new round of voting. Amidst the shouting, Speaker Chuan continued reading the remaining results, revealing that other ministers survived the vote."
 thai_events.35.a: "It's over"
 
