 ###Idea###
 SIA_lack_of_the_political_legitimacy: "Lack of the Political Legitimacy"
 SIA_lack_of_the_political_legitimacy_desc: "\n\n\n\n\n£GFX_SIA_prayut_coa_cat\n\n\n\n\n\nThailand`s political legitimacy has been repeatedly questioned due to the unelected Senate, which plays a decisive role in selecting the Prime Minister and influencing governance despite lacking democratic representation. This has created a widespread perception that the Senate serves as a safeguard for certain political groups rather than the public interest. Likewise, the Election Commission has been criticized for alleged bias and lack of transparency, with accusations of manipulating electoral processes to favor particular parties. These factors have significantly eroded public trust in elections as a true reflection of the people's will.\n\nThe slim majority in the House of Representatives further weakens the government`s stability, forcing it to engage in behind-the-scenes bargaining with smaller parties or independents. This dependency on undemocratic mechanisms—along with the influence of appointed institutions—reinforces the view that political power in Thailand is disconnected from genuine democratic choice. Consequently, public confidence in the legitimacy of the political system continues to deteriorate."
 SIA_an_army_with_a_country_1: "An Army with a Country"
 SIA_an_army_with_a_country_1_desc: "\n\n\n\n\n£GFX_SIA_army_with_nation_cat\n\n\n\n\n\nThe Royal Thai Army is regarded as the nation`s protective shield and a pillar of internal security. Despite facing challenges in adapting to modern warfare, the army continues to rely on traditional strategies and weaponry supported by foreign allies. Training remains rigorous, with an emphasis on discipline over tactical flexibility, resulting in a strong defensive capability but limited expertise in contemporary maneuver warfare. The army also maintains significant influence over national politics and governance, often ensuring that strategic decisions reflect its own interests.\n\nAlthough the Royal Thai Army possesses well-prepared personnel and a stable organizational structure, its reliance on imported weapons and technological limitations prevent it from achieving full effectiveness in modern combat. A centralized command structure and the prioritization of internal power dynamics have hindered the development of long-term strategic planning. Nevertheless, its expertise in domestic operations and its ability to maintain internal order continue to make the Royal Thai Army a force that cannot be underestimated in Southeast Asia."
 SIA_constitution_60: "The Constitution of Thailand (2017)"
 SIA_constitution_60_desc: "\n\n\n\n\n£GFX_SIA_the_constitution_of_thailand_cat\n\n\n\n\n\nThe Constitution of the Kingdom of Thailand (2017), the Highest law of the land have been proclaimed as the Constitution on the 6th of April 2017. However, the Process of the drafting of the Constitution have been controversial ever since. In, 2015 the Constitutional Drafting Committee submitted their Draft of the Constitution into the National Reform assembly, Of which the draft failed to passed. Extended the Length of the NCPO. Before in 2016 the New Constitutional Drafting Committee lead by Meechai Ruchuphan's draft passed the National Reform Steering Assembly and then passed the nationwide referendum.\n\nThe Controversies around the Constitution included, the \"Temporary\" 250-Military appointed Senators and their exclusive power to voted on the Prime Ministerial Nomination during their time as Senators, The \"Special\" requirement of the Constitutional Amendment that the Majority of the National Assembly shall included 1/3 of the Senators and the \"Independent Organizations\" which were subjected and appointed by the Senators."
 SIA_oil_crisis: "Oil Crisis"
 SIA_lottery_conscription: "Lottery Conscription"
 SIA_lottery_conscription_desc: ""…what makes Thailand's system of conscription interesting is the fact that it operates based on a lottery system with each recruitment center every April having a set quota of bodies that it must enlist in the service dictating how big the lottery is set to be…\n\n…you are to draw your card and face the large crowd of other lads and their mortified mothers, if the card you draw is black, lucky you!, you get to waddle home and continue on with your life unmolested, §Rif your card is red however….§!"\n- Count Dankula (Mark Meechan)"
 SIA_low_income_only_welfare: "Low-Income Only Welfare"
 SIA_low_income_only_welfare_desc: ""Today, nobody wants to be called poor. I don't look at them that way either, But We have to expand their income with many projects that can't make them out of the poverty but will make them happy." - Prayut Chan-O-Cha"
 ###Event###
 thailand_politics.1.t: "Constitutional Court's Verdict on the Future Foward Party"
 thailand_politics.1.d: "The Constitutional Court ruled to dissolve the Future Forward Party (FFP) and bar its executive committee members from holding office. The Court pointed out that regarding the case of Thanathorn giving a loan to the FFP, even though partial loan repayment had been made, the nature of the loan agreement was intended to provide special assistance to the FFP and did not align with normal commercial or financial practices, thus constituting a prohibited de facto benefit under the law.\n\nThe Court also stated that although the loan was not considered income, it was deemed a political receipt. Furthermore, the Court ruled to revoke the right to run for election for the executive committee members for 10 years."
 thailand_politics.1.a: "It's over"

 thailand_politics.2.t: "A New Year, With Nothing New"
 thailand_politics.2.d: "Somboon was sitting in his apartment, well, his mother's rented apartment, to be exact, at the start of a new year. \n\nHe had just been denied a job application on the grounds of 'inexperience' and 'not matching skill needs.', even though his classmate, who coincidentally had family ties to the company, was accepted without a problem.\n\nAs he scrolled through television channels, the prime minister`s speech aired on the screen. While the speech played, his mind wandered. Why isn`t our economy growing? What happened to freedom of speech? Was the restoration of 'democracy' even democratic??\n\nWhen the broadcast ended, a single question lingered in his mind:"
 thailand_politics.2.a: "How long will this §Rlast§!?"

 thailand_politics.3.t: "Budget Bill Passed"
 thailand_politics.3.d: "The Budget Bill (B.E. 2563/2020), introduced by the government in October last year, outlines total expenditures of 3.2 trillion baht, an increase of 200 billion baht from the previous fiscal year, and projects a deficit of 469 billion baht. After four days of debate between government and opposition MPs, the bill passed with 253 votes in favor, while 196 opposition MPs abstained."
 thailand_politics.3.a: "Looking Good"

 thailand_politics.4.t: "Three Fingers"
 thailand_politics.4.d: "Sometimes reality imitates fiction rather than the other way around. \n\n£GFX_hunger_games_logo The Hunger Games, a dystopian novel by Suzanne Collins that became a globally successful film franchise, features the iconic three-finger salute as a symbol of resistance against the authoritarian state of Panem. In the story, the salute is first shown when citizens of District 12 raise the gesture to honor the protagonist, Katniss Everdeen, after she volunteers in place of her sister.\n\nAlthough the series is American, the salute took on real political meaning in Thailand after the 2014 coup by the NCPO. Protesters adopted it as a sign of defiance and were arrested for doing so. Now, as anti-government demonstrations resurfaced, the gesture re-emerged leading some to nickname the new protest movement "Three Fingers", while opponents derisively called them "Three Hooves." "
 thailand_politics.4.a: "Are you coming to the tree?"

 thailand_politics.5.t: "Formation of the Move Forward Party"
 thailand_politics.5.d: "Following the Constitutional Court's ruling to dissolve the Future Forward Party, its members, led by Pita Limjaroenrat, announced to the press that they would form a successor party: £GFX_orange_party_2 the Move Forward Party. They pledged to carry on the progressive, left-wing, and anti-junta agenda of their predecessor. 55 of Future Forward's 65 MPs have declared their affiliation with the new party. \n\nMembers of the dissolved party who were barred from holding political office by the court's decision, led by Thanathorn Juangroongruangkit and Piyabutr Saengkanokkul, have also announced the formation of a political group called £GFX_progressive_movement the Progressive Movement, which will operate as an extra-parliamentary leftist think tank."
 thailand_politics.5.a: "It still not over for the orange party"
 
 thailand_politics.6.t: "Oil Crisis Hits Thailand"
 thailand_politics.6.d: "Political instability in Saudi Arabia has led to a sharp rise in global oil prices, creating a ripple effect across the economy. Although Saudi Arabia accounted for only around 18–20% of Thailand's oil imports, petrol prices within the country have skyrocketed.\n\nThe Ministry of Energy has already invited oil refineries and oil traders to discuss the situation. The ministry reiterated that Thailand's domestic oil reserves are sufficient to meet demand for approximately 100 days and stated that it is also seeking alternative oil sources from other countries, including the United States and countries in Africa.\n\nPrime Minister Prayut Chan-o-cha told the press that his government is closely monitoring the situation in Saudi Arabia and has already taken preemptive measures to mitigate the impact of such developments.\n\nThe increase in oil prices has led to massive lines of commuters filling up their vehicles, with many gas stations running out of fuel and being forced to turn customers away. Public dissatisfaction with the government has also greatly increased, coupled with the recent dissolution of the Future Forward Party and the ongoing COVID-19 pandemic."
 thailand_politics.6.a: "This is worrying"
 
 thailand_politics.7.t: "A House Divided"
 thailand_politics.7.d: "The Constitutional Court's decision to dissolve the Future Forward Party sparked a strong public backlash and has been widely perceived as an act of democratic suppression. The reaction was particularly strong among Gen Z supporters and voters, many of whom responded with anger and resentment, leading to demonstrations across high schools, colleges, and universities nationwide. This wave of protests marked the latest surge in a movement that has become increasingly vocal in its demands for political reform. In recent days, the kingdom has witnessed near-daily rallies, largely driven by young protesters denouncing the government of Prime Minister Prayut Chan-o-cha.\n\nIn response, young people have mobilized through activism—raising three-finger salutes, displaying placards and banners with anti-government messages, and organizing sit-ins and flash mobs. Due to the COVID-19 pandemic, much of this activism has shifted online, where the movement has gained further momentum, particularly on Twitter, with activists amplifying their message through coordinated hashtag campaigns and posts.\n\nThe situation now resembles a powder keg: the party's dissolution has pushed public frustration of left wing citizens to a boiling point, while youth-led movements continue to gain momentum. At the same time, conservatives and the government are growing increasingly concerned about what they view as radical far left rhetoric from the protestors. The question now is: which side are you on?"
 thailand_politics.7.a: "Down with the Prayut dictatorship!"
 thailand_politics.7.b: "The three hooves leftists must be crushed!"
 
 thailand_politics.8.t: "Abduction and Disappearance of Wanchalearm Satsaksit"
 thailand_politics.8.d: "Wanchalearm Satsaksit, a Thai political activist and exile and a vocal critic of Prayut Chan-o-cha and his government, was abducted and subsequently disappeared. At the time, the 37 year old had been living in exile in Phnom Penh, Cambodia since 2014.\n\nAccording to witnesses, a group of armed men forcibly seized Wanchalearm and pushed him into a black SUV. He was heard shouting for help in Khmer as bystanders began to approach, but the abductors warned them to stay back before fleeing the scene.\n\nWanchalearm was affiliated with the United Front for Democracy Against Dictatorship (UDD), also known as the Red Shirts. The group was originally formed in 2006 in opposition to the coup that removed then prime minister Thaksin Shinawatra from power.\n\nFollowing the May 22, 2014 coup, when the military seized power, Wanchalearm was among those ordered to report to the National Council for Peace and Order (NCPO) on June 8, 2014, but he did not appear. As a result, an arrest warrant was issued for failing to comply with the NCPO order. He was subsequently charged with failing to respond to a summons by the military junta, and in 2015, he was accused of lese majeste.\n\nWanchalearm fled to Laos to avoid arrest and later moved from Laos to Cambodia. He have stated that he chose not to seek asylum in a democratic nation in Europe, the United States, or Japan because he opted to run an agricultural business there.\n\nMany consider the incident to be a case of enforced disappearance, possibly involving Thai or Cambodian authorities. Amnesty International has called for an independent and transparent investigation into his disappearance. Other human rights groups have echoed these concerns."
 thailand_politics.8.a: "#saveWanchalerm"
 thailand_politics.8.b: "I wonder who did that…"

 thailand_politics.9.t: "Cobra Gold 2020"
 thailand_politics.9.d: "The 39th Cobra Gold exercise marked another installment of the long-running joint military drills co-hosted by Thailand and the United States since 1982.\n\nThis iteration maintained a balanced focus on both security operations and humanitarian cooperation. Core activities included command post exercises, humanitarian civic assistance projects, disaster relief training, and live-fire field exercises designed to strengthen coordination among participating forces.\n\nCobra Gold is rooted in the enduring U.S.-Thai partnership, reflecting decades of close diplomatic and military collaboration. It also serves as a platform highlighting the region's growing commitment to peace, stability, and security.\n\nThe live-fire tactical exercise brought together soldiers from 29 participating countries, all of whom were required to strictly follow COVID-19 prevention measures. Seven countries participated in the main drills: Indonesia, Japan, Malaysia, Singapore, South Korea, Thailand, and the United States. Training activities included high-altitude parachute infiltration, sniping, air interdiction, preparatory and supporting artillery fire, engineer route clearance, fire-and-maneuver operations, air assault, close air support, air mobility operations, aeromedical evacuation, and objective seizure."
 thailand_politics.9.a: "Three Cheers for the Red, White, and Blue!"
 
 thailand_politics.10.t: "COVID-19 case involving an Egyptian soldier in Rayong"
 thailand_politics.10.d: "An Egyptian soldier, along with 30 others, including the aircraft crew, traveled from Egypt on a military diplomatic mission to China, with stops in Pakistan and the United Arab Emirates before arriving at U-Tapao Airport in Rayong. The group stayed at a hotel in Rayong and later visited a nearby shopping mall. The Egyptian military crew members who entered Thailand tested positive for COVID-19 and did not comply with prevention measures. The soldier was subsequently confirmed to have tested positive for COVID-19.\n\nThe incident prompted authorities to deploy an investigation team to Rayong Province to trace the soldier's movements. It also sparked public criticism of Prayut Chan-o-cha government, especially on social media, for allowing potentially infected foreign visitors to enter the country without adequate screening, as well as criticism of the Egyptian government after a video resurfaced showing the Egyptian soldier refusing to comply with COVID-19 testing by Thai authorities.\n\nThe Ambassador of the Arab Republic of Egypt to Thailand expressed regret for the incident and pledged that such an event would not happen again."
 thailand_politics.10.a: "What Egyptian soldier would be so brash as to act this way?"
 thailand_politics_10_texticon: ".\n\n\n\n\n£GFX_egyptian_soldier_video\n\n\n\n\n\n"

 thailand_politics.11.t: "Palang Pracharat Fallout and Cabinet Reshuffle"
 thailand_politics.11.d: "Main characters of the Palang Pracharat Party most notably the 'Four Coaches,' which included Party Leader and Minister of Finance Uttama Savanayana, Party General Secretary and Minister of Energy Sontirat Sontijirawong, Deputy Party Leader and Minister of Higher Education Suvit Maesincee, and Party Executive Committee Member Kobsak Pootrakool all announced at a press conference at Centara Grand at Central Plaza Ladprao, Bangkok, their intention to resign from the Palang Pracharat Party.\n\nMany media speculations pointed out that since the formal formation of the government in 2019, the party was faced with a series of scandals and criticism regarding the party's handling of their own background checks for MPs, and also the consolidation of the military faction within the Palang Pracharat Party. This turned out to be true as the party members met and elected General Prawit Wongsuwon as their own party leader.\n\nIn the meantime, the 'Four Coaches' group all announced their resignation from the cabinet. The Prime Minister announced the replacements, which included many people from other factions within the Palang Pracharat Party."
 thailand_politics.11.a: "Well... that's an entire year wasted."
