 SIA_khana_ratsadon_reborn_desc: ""
 
 SIA_long_march_through_the_institutions: "Long March Through the Institutions"
 SIA_long_march_through_the_institutions_desc: "Most working-class Thai people, especially older generation Salim boomers, have been so thoroughly indoctrinated by feudalistic dogma since birth that they are often unreceptive or hostile to the ideological views of our movement for revolution and social change, frequently siding with the ruling dictatorship class.\n\nTo truly accomplish social change in Thailand, we, whose membership consists largely of Gen Z, must undertake a "long march through the institutions" a generational shift beginning in the heart of our universities and schools. Students and professors committed to the cause must spearhead efforts to build influence within educational and civic institutions. By playing the long game, we can challenge the Feudalists and Fascists and build the foundations of a more democratic and progressive society, as others have done successfully throughout history."
 
