 hybrid_regime_SIA: "Stratocratic Conservatism"
 SIA_hybrid_regime_desc: "\n\n\n\n£GFX_stratocratic_conservatism\n\n\n\n\n\n§YStratocratic Conservatism§! follows the idea that a strong figure from the military can ensure stability within the country and is essential to maintaining national unity and safeguarding tradition, placing strong emphasis on the nation, religion and monarchy.\n\nA stratocratic conservative government differs from a military junta or an outright dictatorship in that democratic institutions are retained to legitimize authority and maintain public participation, but they are still skewed to serve the government"

 ###Characters###
 SIA_rama_x_char_desc: "King Vajiralongkorn (Rama X) is the tenth monarch of the Chakri Dynasty and the Supreme Commander of the Royal Thai Armed Forces. Born on July 28, 1952, to King Bhumibol Adulyadej (Rama IX) and Queen Sirikit, he is the only son among four children and was declared the heir to the throne in 1972.\n\nHe received his secondary education at The King's School in Sydney before enrolling at the Royal Military College, Duntroon (RMC). There, he trained as a fighter pilot and military tactician, becoming qualified to fly both civilian Boeings and military fighter jets. As Crown Prince, he served as an officer in the Royal Thai Army, gaining direct experience in various military operations. He also partook in royal duties both at home and abroad.\n\nIn recent years, his military role has become increasingly ceremonial. As his father grew older, Vajiralongkorn took a more prominent part in royal ceremonies and public appearances, such as the charity event 'Bike for Dad.' and 'Bike for Mom.' \n\nAfter the passing of King Bhumibol Adulyadej (Rama IX) in 2016, Vajiralongkorn ascended the throne as King Rama X of the Chakri Dynasty. His coronation in 2019 confirmed his role as Thailand’s constitutional and spiritual head of state, with a reign focused on maintaining a strong, stable, and centralized monarchy amid a politically polarized nation."
 SIA_prayut_chan-o-cha_char_desc: "General Prayut Chan-o-cha, often known by his nickname 'Uncle Tu' or 'Big Tu', was born to an army colonel father and a school teacher mother. From a young age, he was enrolled at the Armed Forces Preparatory School and later became a cadet at the Chulachomklao Royal Military Academy.\n\nPrayut steadily climbed the ranks of the armed forces, rising from a major in the 21st Infantry Regiment, known as the `Queen`s Guards`, to a military general and Commander-in-Chief of the Royal Thai Armed Forces in 2010.\n\nAmid the turbulent political climate of 2014, marked by deep polarization and prolonged unrest, the Thai armed forces once more staged a coup d`état on 22nd May 2014 against the civilian government, placing the country under the National Council for Peace and Order (NCPO), with Prayut Chan-o-cha at its head.\n\nAlthough the NCPO was officially dissolved on 10 July 2019 following the general election, Prayut remained prime minister. Backed by the Palang Pracharath Party, he was nominated as its candidate and subsequently elected by Parliament to lead a second cabinet, despite strong opposition and criticism. \nIn recent years, rising political awareness among younger and left-wing groups has intensified scrutiny of his rule. Nevertheless, he continues to receive support from conservative segments of society who view his leadership as a source of stability amid uncertainty."
