 thai_newsevents.1.t: "Major Protests in Thailand"
 thai_newsevents.1.d: "In Thailand, following the Constitutional Court's decision to dissolve the Future Forward Party, the largest opposition party in parliament, protests and demonstrations emerged against the government of Prayut Chan-o-cha, who had assumed power through a military coup. Supporters viewed the move as state suppression of the opposition, though the demonstrations were later paused due to the COVID-19 pandemic.\n\nHowever, following the disappearance of activist Wanchalearm Satsaksit, rising prices caused by the oil crisis, and broader opposition to the ruling government, the movement regained momentum amid growing public anger.\n\nThe protestors had no unified leadership, but were generally made up of liberals and leftists who put forward multiple demands, primarily calling for an early general election, the resignation of General Prayut Chan-o-cha as Prime Minister, and a complete rewriting of the constitution. They also called for reforms to the monarchy, which remains controversial in Thailand due to the monarchy being revered by conservatives and criticism of it being illegal under lese-majeste laws which carry a prison sentence.\n\nIn response, the government declared a state of emergency, tightened COVID-19 restrictions, deployed riot police across Bangkok, and mobilized state lawyers to pursue legal action against what it called an "unlawful demonstration.""
 thai_newsevents.1.a: "Interesting..."
    
