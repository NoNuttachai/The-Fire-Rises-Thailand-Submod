 thai_events.37.t: "No Excuses, It's over"
 thai_events.37.d: "In the aftermath of the no-confidence motion that toppled Prime Minister Prayut Chan-o-cha, all eyes turned to the upcoming joint session of the National Assembly to elect a new premier. The 12th Senate, appointed by the NCPO under Prayut's political mechanism, possessed the power to nominate an 'outsider' candidate; however, doing so would have defied the so-called 'democratic order.'\n\nUltimately, Caretaker Prime Minister Prawit Wongsuwan urged the Senate to relinquish its authority in the election-either by supporting a constitutional amendment or by voting in alignment with the House of Representatives' majority."
 thai_events.37.a: "...The Constitutional Amendment"
 thai_events.37.b: " ...Align with the House"
 
 thai_events.38.t: "Thai Patriotic Singer Santi Lunphae Passes Away"
 thai_events.38.d: "Lieutenant Commander Santi Lunphae, a legendary Thai tenor, actor, songwriter, and musician, has passed away at the age of 88. Renowned for his distinctive and powerful voice, he served with distinction in the Royal Thai Navy Band, where he taught vocal performance and arranged musical harmonies. He was widely admired for his contributions to Thai music, particularly in patriotic songs, classical works, and film soundtracks.\n\nThroughout his illustrious career, he left behind a vast and enduring musical legacy that resonated deeply with the Thai people. He is perhaps best remembered for his iconic renditions of royal compositions by King Rama IX, particularly "The Highest Dream" (Khwam Fan An Sood Sut), a performance he considered the greatest pride of his artistic journey.\n\nSanti's passion for music began at an early age. He once recalled teaching himself to sing at the age of five by imitating recordings of the famous Italian opera singer Enrico Caruso. He later joined the Royal Thai Navy Band, where he taught vocal performance and arranged musical harmonies before pursuing a full-time career as a singer and classical vocal instructor.\n\nBecause of his unique voice, he had the opportunity to sing with the Royal Thai Navy Orchestra before Her Majesty Queen Sirikit at the International Red Cross Royal Banquet. Later, he was invited to record royal compositions and patriotic songs, and he continued to serve the royal family by singing for them on a regular basis.\n\nHis artistic achievements earned widespread recognition, culminating in his designation as a National Artist in the Performing Arts. In his later years, he continued to teach classical singing and served as an advisor to the Dean of the College of Music at Mahidol University."
 thai_events.38.a: "To gild the back of the Buddha statue....."
 
