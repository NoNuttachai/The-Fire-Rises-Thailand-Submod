 SIA_social_media_activism_desc: "Everyday people have harnessed the power of their phones and social media to educate, organize, and rally one another. Instead of relying on news networks controlled by the rich and powerful, we are using these tools to spread the truth, mobilize our communities, and build real nationwide solidarity faster and more passionately than ever before."
 
