 thailand_politics.24.t: "£GFX_facebook_logo  Free YOUTH's post"
 thailand_politics.24.d: "£GFX_free_youth_header \n\nWe have 3 demands! \n\n1. "Parliament must be dissolved." - The government, under Prayut Chan-o-cha, have failed to manage the economy, particularly through its mismanagement of oil prices following the crisis in Saudi Arabia and the COVID-19 pandemic, which led to widespread unemployment and loss of income. It failed to provide comprehensive and equitable relief, neglecting to address the economic hardships faced by the people. Furthermore, it allowed VIP guests infected with the virus to enter the country without quarantine, posing a significant risk of a second major outbreak. We demand that the Prime Minister dissolve Parliament and step down to pave the way for capable individuals to solve political and economic problems.\n\n2. "Stop threatening the citizens" - Following the 2019 election, many hoped Thailand would become more democratic, with freedom of expression and assembly protected from harassment. In reality, however, physical and psychological intimidation has continued much as it did under the NCPO. National security has been used as a pretext to silence those demanding democracy and justice. We therefore demand an end to all forms of harassment and the fabrication of charges against citizens. \n\n3. "New constitution" - The current constitution, drafted by Prayut Chan-o-cha and his cronies, was designed for him and soldier-turned-politicians in power to preserve authoritarian rule under disguised as democracy. Thailand’s transition to genuine democracy therefore requires the drafting of a new constitution free from interference by unelected individuals. "
 thailand_politics.24.a: "Down with dictatorship! Long live democracy!"
 
 thailand_politics.25.t: "£GFX_facebook_logo  Free YOUTH's post"
 thailand_politics.25.d: "£GFX_free_youth_header \n\nAnnouncing the launch of RT MOVEMENT - The One-Point Movement Team\n.\nThis is a new movement that will be unlike anything before. Awakening the class consciousness of oppressed proletarians. Whether you are a student, office worker, maid, security guard, plainclothes worker, farmer, or civil servant, "we are all oppressed proletarians"."\n.\nThis RT MOVEMENT:\n Has no leaders\n Has no stage\n Has no security guards\n Has no portable toilets\n Has no negotiations\n Has no bargaining!\n.\nJoin us in RESTART THAILAND to create a society where "the masses are equal." Please stay tuned with outlets that we will use to make this happen soon."
 thailand_politics.25.a: "Bruh"
 

 thai_events.1.t: "First Covid-19 Infection Case in Thailand"
 thai_events.1.d: "TNN 16 CHANNEL REPORT\n\nToday, Deputy Prime Minister and Minister of Health Anutin Charnvirakul held a press conference with a World Health Organization Representative, confirming the first COVID-19 case in Thailand and the first infection case reported outside of China. The patient, who was a tourist from China, has been hospitalized and so far recovered. Other family members close to the patient have so far not been infected.\n\nPrime Minister Prayut Chan-o-cha has been notified of the first infection case of COVID-19. The Government has confidence that the Health Agencies can detect and contain the COVID-19 situation in Thailand."
 thai_events.1.a: "Prepare for the Worse..."
 
