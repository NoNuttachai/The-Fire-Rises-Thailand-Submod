 SIA_emergency_loan_bill_covid: "§RCOVID§!: Emergency Loan Bill"
 SIA_emergency_loan_bill_covid_desc: "With the current global situation affecting Thailand, the government promulgated the 1 Trillion Baht Borrowing Decree, officially known as: §Ythe Emergency Decree Authorising the Ministry of Finance to Raise Loans to Solve Problems, to Remedy and Restore the Economy and Society as Affected by the Coronavirus Disease Pandemic, B.E. 2563 (2020).§!\n\nIf approved by Parliament, it would authorize borrowing of up to 1 trillion baht, making it the largest borrowing measure in Thailand's history to date and far exceeding the scale of previous emergency funding bills."
 SIA_emergency_loan_bill_oil_crisis: "§YOil Crisis§!: Emergency Loan Bill"
 SIA_emergency_loan_bill_oil_crisis_desc: "Under normal circumstances, the Oil Fuel Fund Act of 2019 strictly regulates how the government may intervene in fuel markets. To prevent the state from accumulating excessive liabilities, the law caps the fund's borrowing authority at 40 billion baht.\n\nHowever, during a major global crisis such as the situation in Saudi Arabia, 40 billion baht is merely a drop in the bucket and is insufficient to stabilize domestic fuel prices for any meaningful period of time. To address this extraordinary situation, the government has proposed an emergency decree authorizing the Ministry of Finance to guarantee up to 150 billion baht in commercial loans for the Oil Fuel Fund, significantly expanding its financial capacity to cushion the impact of soaring energy costs and ensure continued support for consumers and businesses facing rising fuel prices."


