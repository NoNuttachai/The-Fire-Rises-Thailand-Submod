 # Party Detail Panels
 SIA_parliament_detail_pprp_header1: "£GFX_palang_pracharath §YPalang Pracharath Party§! (Phak Palang Pracharath)\n\n\n\n\n\n£GFX_SIA_intro_PPRP\n\n\n\n\n\n\n\n§YParty Leader:§! Uttama Savanayana"
 SIA_parliament_detail_pprp_header2: "£GFX_palang_pracharath §YPalang Pracharath Party§! (Phak Palang Pracharath)\n\n\n\n\n\n£GFX_SIA_intro_PPRP1\n\n\n\n\n\n\n\n§YParty Leader:§! General Prawit Wongsuwan"
 SIA_parliament_detail_pprp_desc: "[PPRPPartyStatus]\n\n§YPalang Pracharath Party§! is a Thai political party founded in 2018 to support the continuation of General Prayut Chan-o-cha's tenure as prime minister following the planned 2019 elections. Widely regarded as the political arm of the military establishment, the party drew its core support from right wing voters, and supporters of the junta.\n\nThe party's core platform focuses on §Ynational stability, economic development under strong leadership, and continuity§! of the policies enacted under the NCPO. Despite criticism that the party served as a political vehicle for the junta, Palang Pracharath emerged as the largest party by popular vote in the 2019 election and formed a coalition government that enabled Prayut Chan-o-cha to continue his premiership.."
 
 SIA_parliament_detail_ptp_desc: "£GFX_phua_thai §YPheu Thai Party§! (Phak Pheu Thai)\n\n\n\n\n\n£GFX_SIA_intro_PTP\n\n\n\n\n\n\n\n§YParty Leader:§! Sompong Amornvivat\n\n§YPheu Thai Party§! was founded in 2007 and is considered the third incarnation of the Thai Rak Thai Party, a political party founded by former prime minister §YThaksin Shinawatra§! in 1998. Following the dissolution of its predecessor parties by court rulings, Pheu Thai emerged as the main political base of the Shinawatra family. The party is generally associated with §Ypopulist and liberal conservative policies§!, with strong support from rural voters in northern and northeastern Thailand. \n\nPheu Thai has remained one of the most influential political parties in contemporary Thailand and has won multiple general elections despite repeated political crises, military coups, and judicial interventions against parties linked to the Shinawatra family."

 SIA_parliament_detail_ffp_desc: "£GFX_orange_party_1 §YFuture Forward Party§! (Phak Anakhot Mai)\n\n\n\n\n\n£GFX_SIA_intro_FFP\n\n\n\n\n\n\n\n§YParty Leader:§! Thanathorn Juangroongruangkit\n\n§YFuture Forward Party§! is a left wing Thai political party founded by §YThanathorn Juangroongruangkit§!, vice president of Thai Summit Group, Thailand's largest auto parts manufacturer, and §YPiyabutr Saengkanokkul§!, a Marxist legal scholar. The party has strong support among liberals, progressives, and leftists especially Thai youth who have grown disillusioned with the right-wing establishment.\n\nThe party campaigns on §Ydemocratic reform, opposition to military intervention in politics, the development of a welfare state to reduce social inequality, progressive social values, and the abolition of lèse-majesté laws (Section 112).§!\n\n§RThe party is currently facing charges before the Constitutional Court over alleged violations of election laws, including accusations that it sought to undermine the monarchy and breached regulations concerning political donations. If found guilty, the party could face dissolution. Supporters of the party argue that the case is politically motivated and intended by the government to suppress the opposition.§!"

 SIA_parliament_detail_dp_desc: "£GFX_democrat §YDemocrat Party§! (Phak Prachathipat)\n\n\n\n\n\n£GFX_SIA_intro_DP\n\n\n\n\n\n\n\n§YParty Leader:§! Jurin Laksanawisit\n\n§YThe Democrat Party§! is Thailand's oldest active political party, founded in 1946. §YIt has long positioned itself as a defender of conservatism, constitutional monarchism, and liberal democratic values.§! Historically, the party has drawn much of its electoral support from southern Thailand and Bangkok. Several of Thailand's prime ministers have emerged from the party, including §YKhuang Aphaiwong, Seni Pramoj, Chuan Leekpai,§! and §YAbhisit Vejjajiva.§! \n\nDespite its historical prominence, the party's influence has declined significantly in recent elections, especially in Bangkok, where its support base has rapidly eroded.\n\nIn the 2019 general election, the party won 53 seats in parliament and later joined the Palang Pracharath-led coalition government.\nThe decision proved controversial and cost the party support among many of its more liberal and anti-junta supporters."

 SIA_parliament_detail_bjt_desc: "£GFX_bhumjaithai §YBhumjaithai Party§! (Phak Phumchai Thai)\n\n\n\n\n\n£GFX_SIA_intro_BJT\n\n\n\n\n\n\n\n§YParty Leader:§! Anutin Charnvirakul\n\n§YBhumjaithai Party§! is a Thai political party founded in 2008. Under the leadership of §YAnutin Charnvirakul§!, the party has carved out a niche focusing on §Ypragmatic populism, rural development, and public health reform§!.\n\nNotably, Bhumjaithai became the first party in Thailand to champion §Gthe legalization of cannabis for medical and economic purposes.§! The party joined the government coalition after the 2019 election, securing key cabinet positions including the Ministry of Public Health."

 SIA_parliament_detail_tlp_desc: "£GFX_thai_liberal_party §YThai Liberal Party§! (Phak Seri Ruam Thai)\n\n\n\n\n\n£GFX_SIA_intro_TLP\n\n\n\n\n\n\n\n§YParty Leader:§! Sereepisuth Temeeyaves\n\n§YThai Liberal Party§! is a minor Thai political party led by former national police chief §YSereepisuth Temeeyaves§!. The party positions itself as a §Yliberal, reformist party§! advocating for police reform, anti-corruption measures, and civil liberties.\n\nIn the 2019 election, the party won 10 seats and aligned with the opposition bloc."
 
 SIA_parliament_detail_ctpp_desc: "£GFX_chartthaipattana §YChart Thai Pattana Party§! (Phak Chart Thai Pattana)\n\n\n\n\n\n£GFX_SIA_intro_CTPP\n\n\n\n\n\n\n\n§YParty Leader:§! Kanchana Silpa-archa\n\n§YChart Thai Pattana Party§! is a Thai political party that emerged from the dissolution of the original Chart Thai Party. Led by the Silpa-archa political family, the party maintains a §Yconservative, business-oriented platform§! with strong support in central Thailand.\n\nThe party joined the government coalition after the 2019 election, contributing 10 seats to the ruling majority."
 
 SIA_parliament_detail_pcc_desc: "£GFX_prachachat §YPrachachat Party§! (Phak Prachachat)\n\n\n\n\n\n£GFX_SIA_intro_PCC\n\n\n\n\n\n\n\n§YParty Leader:§! Wan Muhamad Noor Matha\n\n§YPrachachat Party§! is a Thai political party founded in 2018, primarily representing the §YMuslim-majority provinces in southern Thailand§!. Led by veteran politician §YWan Muhamad Noor Matha§!, the party focuses on issues affecting the southern border provinces near Malaysia, including §Ypeace and reconciliation, Muslim cultural rights, decentralization, and economic development.§!.\n\nIn the 2019 election, the party won 7 seats, all from southern constituencies, and aligned with the opposition."

