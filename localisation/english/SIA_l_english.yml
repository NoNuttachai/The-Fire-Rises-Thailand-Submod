 thailand_nonpolitical.1.t: "Soldier Goes Rogue, Unleashes Massacre in Korat"
 thailand_nonpolitical.1.d: "A horrific massacre just occurred in Korat, Nakhon Ratchasima when a Thai Army sergeant, angered by a property dispute with his commanding officer, shot and killed him, raided the army camp armory, and then stole a Humvee, and begun rampaged through the streets fired hundreds of rounds, shooting people in cars, killing and injuring them. He also shot school children riding motorcycles and walked over to shoot them again. Then, two policemen arrived and before they could get out of their cars, they were shot and killed.\n\nHe then arrived at the Terminal 21 Korat shopping mall in the city of Nakhon Ratchasima, where he opened fire indiscriminately at civilians, killing 12 people. The attacker later fired at a cooking gas cylinder outside the mall, triggering an explosion and fire. Video footage showed terrified civilians running for safety and taking cover behind cars as gunshots echoed throughout the mall.\n\nPart of the attack was livestreamed by the gunman on Facebook Live. During the attack, he also posted messages on Facebook showing no signs of remorse before his account was eventually taken down by the platform.\n\nPolice and soldiers stormed the Terminal 21 Korat shopping mall and ordered the gunman to surrender after he took hostages on the fourth floor. However, he continued to open fire, killing additional civilians and law enforcement personnel. He remained inside the mall for several hours while authorities secured the surrounding area and brought in his mother in an attempt to persuade him to surrender peacefully.\n\nAfter nearly 18 hours, elite Thai police and army commandos eventually killed the attacker, bringing the rampage to an end. The attack left 29 people dead and 57 others wounded, making it the deadliest mass shooting carried out by a single individual in Thai history."
 thailand_nonpolitical.1.a: "Such horror occurring in our country?"
 
 thailand_nonpolitical.2.t: "Thai Airways Face Crisis"
 thailand_nonpolitical.2.d: "The Thai Cabinet approved Thai Airways International's filing for bankruptcy protection with the Central Bankruptcy Court after the airline amassed roughly 240 billion baht in debt and recorded continuous losses since 2017. Instead of granting a 58.1 billion baht bailout, authorities directed the carrier to enter a court-supervised rehabilitation process to restructure its debts and continue operations.\n\nThe crisis deepened during the COVID-19 pandemic, which crippled global aviation through travel restrictions and collapsing demand. Even before the pandemic, the airline had reported a 12 billion baht loss in 2019 as passenger numbers declined. In its filing, Thai Airways cited the pandemic and rising global oil prices as key factors behind its financial deterioration.\n\nAs liquidity tightened, the government reduced its stake in the airline to below 50%, ending its status as a state enterprise. Despite earlier denying any intention to declare bankruptcy, the airline ultimately proceeded with rehabilitation. Following the Cabinet decision, Prime Minister Prayut Chan-o-cha stated to the press: "The government has reviewed all dimensions... we have decided to petition for restructuring and not let Thai Airways go bankrupt. The airline will continue to operate.""
 thailand_nonpolitical.2.a: "Perhaps Necessary"

 thailand_nonpolitical.3.t: "The Banning of Pornhub"
 thailand_nonpolitical.3.d: "On the evening of November 2, people in Thailand who had failed No Nut November found themselves unable to access Pornhub. When entering the site, they were met with a white page displaying a message stating, "This content has been suspended due to its illegal acts in accordance with the Computer-related Crime Act 2007 (B.E. 2550) and additional amendments and/or the Gambling Act 1935 (B.E. 2478) and additional amendments" along with the seal of the Ministry of Digital Economy and Society. \n\nThe Ministry of Digital Economy and Society justified the ban on Pornhub by citing its illegality and complaints that it disseminated obscene content, noting that a court order had been issued to suspend access to more than 191 Pornhub URLs. \n\nThe ban has met with various reactions on social media. On Twitter, Thai users trended the hashtag #SavePornhub. Many joked that they could easily bypass the ban with a VPN, that the decision would motivate gooners to join anti-government protests, that the government's ban was actually an attempt to block a scandalous video of £GFX_redacted  on the site, etc. \n\nSome have took to staging demonstrations outside the Ministry of Digital Economy and Society, holding signs (such as "DON'T HURT LONELY FOLKS BY MAKING IT INACCESSIBLE #SavePornhub" in the image below), protesting the government's decision under heavy police security."
 thailand_nonpolitical.3.a: " "LUAK CHUCK WAOW" - Prayut Chan-o-cha " #Stop Masterbating
    
