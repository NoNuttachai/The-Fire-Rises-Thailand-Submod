 SIA_secure_support_from_ned: "Secure Support from NED"
 SIA_secure_support_from_ned_desc: "\n\n\n\n\n£GFX_SIA_National_Endowment_for_Democracy\n\n\n\n\n\nThe National Endowment for Democracy (NED) is a quasi-autonomous, non-governmental organization established by the United States Congress in 1983. Its stated mission is to promote democracy worldwide by supporting democratic institutions and civil society organizations, including political associations.\n\nThe NED did not fund or organize Thailand's student-led protests, but it supported projects related to human rights and civic participationsuch as iLaw. Some conservative and right-wing commentators, such as Sondhi Limthongkul, have alleged that the NED indirectly interfered in Thailand's domestic affairs by funding organizations whose objectives aligned with those of the protest movement. Supporters of the NED reject these claims, arguing that it merely supported civil society initiatives rather than influencing Thai politics.\n\n"—and that government of the people, by the people, for the people, shall not perish from the earth."\n-Abraham Lincoln"
 
 SIA_bbc_coverage_of_the_protestors: "BBC: Coverage of the Protestors"
 SIA_bbc_coverage_of_the_protestors_desc: "The BBC did not formally campaign against the Thai government, but its reporting frequently highlighted allegations of repression, restrictions on civil liberties, and controversies surrounding the government's handling of the protests. As a result, many critics perceived its coverage as unfavorable to the government and sympathetic to the protest movement."
 
 SIA_expand_bbc_thai_service: "Expand BBC Thai Service"
 SIA_expand_bbc_thai_service_desc: "\n\n\n\n\n£GFX_SIA_BBC_Thai\n\n\n\n\n\nBBC Thai is the Thai-language news service of the British Broadcasting Corporation (BBC), operating under the BBC World Service. It publishes news, analysis, features, and articles covering Thailand, Southeast Asia, and international affairs for Thai-speaking audiences.\nLaunched in 2014 as part of the BBC's expansion of its digital-language services, BBC Thai primarily operates through its website and social media platforms rather than traditional television or radio broadcasting.\n\nThe service has been praised by supporters for reporting on issues that may receive limited coverage in some domestic media outlets. However, its reporting has also attracted criticism from some Thai conservative and royalist groups, who argue that its coverage of sensitive political and monarchy-related topics is biased."

 SIA_bbc_on_the_ground_with_jonathan_head: "BBC: On The Ground with Jonathan Head"
 SIA_bbc_on_the_ground_with_jonathan_head_desc: "\n\n\n\n\n£GFX_SIA_BBC_On_the_Ground_with_Jonathan_Head\n\n\n\n\n\nJonathan Head is a veteran British journalist and the long-serving Southeast Asia Correspondent for BBC News. Based in Bangkok, Thailand, he is one of the most recognizable international reporters covering the region, with a career at the BBC spanning more than three decades.\n\nIn Thailand, he is often viewed negatively by right wingers due to allegations that his reporting insulted the monarchy. In 2008, Thai police investigated him under lèse-majesté laws, an offense that can carry a prison sentence of up to 15 years. However, the case did not result in a conviction, reportedly because prosecuting a foreign journalist from the United Kingdom could have caused a diplomatic incident with the British government."
 
 
 
 
 
 
 
 
 
 
 
 
