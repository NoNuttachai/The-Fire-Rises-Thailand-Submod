 SIA_state_of_emergency: "State of Emergency"
 
 ###Event###
 thai_events.1.t: "Constitutional Court's Verdict on the Future Foward Party"
 thai_events.1.d: "The Constitutional Court ruled to dissolve the Future Forward Party (FFP) and bar its executive committee members from holding office. The Court pointed out that regarding the case of Thanathorn giving a loan to the FFP, even though partial loan repayment had been made, the nature of the loan agreement was intended to provide special assistance to the FFP and did not align with normal commercial or financial practices, thus constituting a prohibited de facto benefit under the law.\n\nThe Court also stated that although the loan was not considered income, it was deemed a political receipt. Furthermore, the Court ruled to revoke the right to run for election for the executive committee members for 10 years."
 thai_events.1.a: "It's over"

 thai_events.2.t: "A New Year, With Nothing New"
 thai_events.2.d: "Somboon was sitting in his apartment, well, his mother's rented apartment, to be exact, at the start of a new year. \n\nHe had just been denied a job application on the grounds of 'inexperience' and 'not matching skill needs.', even though his classmate, who coincidentally had family ties to the company, was accepted without a problem.\n\nAs he scrolled through television channels, the prime minister`s speech aired on the screen. While the speech played, his mind wandered. Why isn`t our economy growing? What happened to freedom of speech? Was the restoration of 'democracy' even democratic??\n\nWhen the broadcast ended, a single question lingered in his mind:"
 thai_events.2.a: "How long will this §Rlast§!?"

 thai_events.3.t: "Budget Bill Passed"
 thai_events.3.d: "The Budget Bill (B.E. 2563/2020), introduced by the government in October last year, outlines total expenditures of 3.2 trillion baht, an increase of 200 billion baht from the previous fiscal year, and projects a deficit of 469 billion baht. After four days of debate between government and opposition MPs, the bill passed with 253 votes in favor, while 196 opposition MPs abstained."
 thai_events.3.a: "Looking Good"

 thai_events.4.t: "Three Fingers"
 thai_events.4.d: "Sometimes reality imitates fiction rather than the other way around. \n\n£GFX_hunger_games_logo The Hunger Games, a dystopian novel by Suzanne Collins that became a globally successful film franchise, features the iconic three-finger salute as a symbol of resistance against the authoritarian state of Panem. In the story, the salute is first shown when citizens of District 12 raise the gesture to honor the protagonist, Katniss Everdeen, after she volunteers in place of her sister.\n\nAlthough the series is American, the salute took on real political meaning in Thailand after the 2014 coup by the NCPO. Protesters adopted it as a sign of defiance and were arrested for doing so. Now, as anti-government demonstrations resurfaced, the gesture re-emerged leading some to nickname the new protest movement "Three Fingers", while opponents derisively called them "Three Hooves." "
 thai_events.4.a: "Are you coming to the tree?"

 thai_events.5.t: "Formation of the Move Forward Party"
 thai_events.5.d: "Following the Constitutional Court's ruling to dissolve the Future Forward Party, its remaining members, led by Pita Limjaroenrat, announced the formation of a successor political party:\n\n£GFX_orange_party_2 The Future Forward Party. Speaking to the press, Pita pledged to carry on the progressive, left-wing, and anti-junta agenda of his predecessor party. 55 of Future Forward's 65 MPs declared their affiliation with the new party.\n\nConcurrently, Future Forward Party executives who were handed a ten-year ban from political office by the court's decision, led by party founder Thanathorn Juangroongruangkit and secretary-general Piyabutr Saengkanokkul, announced the establishment of a separate political group called:\n\n£GFX_progressive_movement The Progressive Movement. Which will operates as an extra parliamentary leftist think tank and grassroots advocacy organization."
 thai_events.5.a: "It still not over for the orange party"
 
 thai_events.6.t: "Oil Crisis Hits Thailand"
 thai_events.6.d: "Political instability in Saudi Arabia has led to a sharp rise in global oil prices, creating a ripple effect across the economy. Although Saudi Arabia accounted for only around 18-20% of Thailand's oil imports, petrol prices within the country have skyrocketed.\n\nThe Ministry of Energy has already invited oil refineries and oil traders to discuss the situation. The ministry reiterated that Thailand's domestic oil reserves are sufficient to meet demand for approximately 110 days and stated that it is also seeking alternative oil sources from other countries and taking measures to mitigate the impact on local consumers.\n\nPrime Minister Prayut Chan-o-cha told the press that his government is closely monitoring the situation in Saudi Arabia and has already taken preemptive measures to mitigate the impact of such developments.\n\nFears of rising oil prices have led to long lines of commuters filling up their vehicles, with many gas stations running out of fuel and being forced to turn customers away. Public dissatisfaction with the government has also increased significantly, compounded by the recent dissolution of the Future Forward Party and the ongoing COVID-19 pandemic."
 thai_events.6.a: "This is worrying"
 
 thai_events.7.t: "A House Divided"
 thai_events.7.d: "The Constitutional Court's decision to dissolve the Future Forward Party sparked a strong public backlash and has been widely perceived as an act of democratic suppression. The reaction was particularly strong among Gen Z supporters and voters, many of whom responded with anger and resentment, leading to demonstrations across high schools, colleges, and universities nationwide. This wave of protests marked the latest surge in a movement that has become increasingly vocal in its demands for political reform. In recent days, the kingdom has witnessed near-daily rallies, largely driven by young protesters denouncing the government of Prime Minister Prayut Chan-o-cha.\n\nIn response, young people have mobilized through activism—raising three-finger salutes, displaying placards and banners with anti-government messages, and organizing sit-ins and flash mobs. Due to the COVID-19 pandemic, much of this activism has shifted online, where the movement has gained further momentum, particularly on Twitter, with activists amplifying their message through coordinated hashtag campaigns and posts.\n\nThe situation now resembles a powder keg: the party's dissolution has pushed public frustration of left wing citizens to a boiling point, while youth-led movements continue to gain momentum. At the same time, conservatives and the government are growing increasingly concerned about what they view as radical far left rhetoric from the protestors. The question now is: which side are you on?"
 thai_events.7.a: "Down with the Prayut dictatorship!"
 thai_events.7.b: "The three hooves leftists must be crushed!"
 
 thai_events.8.t: "Abduction and Disappearance of Wanchalearm Satsaksit"
 thai_events.8.d: "Wanchalearm Satsaksit, a Thai political activist, exile, and critic of Prayut Chan-o-cha's government, was abducted and subsequently disappeared outside his apartment in Phnom Penh, Cambodia, where he had resided since 2014.\n\nAccording to witnesses, a group of armed men forcibly seized Wanchalearm and pushed him into a black SUV. He was heard shouting, "I can't breathe," and asking for help in Khmer as bystanders began to approach. However, the abductors warned them to stay back before fleeing the scene.\n\nWanchalearm was an activist affiliated with the United Front for Democracy Against Dictatorship (UDD), or the Red Shirts, a movement formed in opposition to the 2006 coup that ousted Thaksin Shinawatra. Following the 2014 military coup, he failed to comply with an NCPO summons, resulting in an arrest warrant. In 2015, Thai authorities accused him of violating Section 112 (lese-majeste).\n\nWanchalearm fled first to Laos and later to Cambodia to avoid arrest. He stated that he chose not to seek asylum in Europe, the United States, or Japan, preferring instead to see refuge in Cambodia because he operate an agricultural business there.\n\nMany have accused the incident to be a case of forced disappearance, possibly involving Thai or Cambodian authorities. Amnesty International has called for an independent and transparent investigation into his disappearance. Other human rights groups have echoed similar concerns."
 thai_events.8.a: "#saveWanchalerm"
 thai_events.8.b: "I wonder who did that…"

 thai_events.9.t: "Cobra Gold 2020"
 thai_events.9.d: "The 39th Cobra Gold exercise marked another installment of the long-running joint military drills co-hosted by Thailand and the United States since 1982.\n\nThis iteration maintained a balanced focus on both security operations and humanitarian cooperation. Core activities included command post exercises, humanitarian civic assistance projects, disaster relief training, and live-fire field exercises designed to strengthen coordination among participating forces.\n\nCobra Gold is rooted in the enduring U.S.-Thai partnership, reflecting decades of close diplomatic and military collaboration. It also serves as a platform highlighting the region's growing commitment to peace, stability, and security.\n\nThe live-fire tactical exercise brought together soldiers from 29 participating countries, all of whom were required to strictly follow COVID-19 prevention measures. Seven countries participated in the main drills: Indonesia, Japan, Malaysia, Singapore, South Korea, Thailand, and the United States. Training activities included high-altitude parachute infiltration, sniping, air interdiction, preparatory and supporting artillery fire, engineer route clearance, fire-and-maneuver operations, air assault, close air support, air mobility operations, aeromedical evacuation, and objective seizure."
 thai_events.9.a: "Three Cheers for the Red, White, and Blue!"
 SIA_joint_training: "Joint Training"
 
 thai_events.10.t: "COVID-19 case involving an Egyptian soldier in Rayong"
 thai_events.10.d: "An Egyptian soldier, along with 30 others, including the aircraft crew, traveled from Egypt on a military diplomatic mission to China, with stops in Pakistan and the United Arab Emirates before arriving at U-Tapao Airport in Rayong. The group stayed at a hotel in Rayong and later visited a nearby shopping mall. The Egyptian military crew members who entered Thailand tested positive for COVID-19 and did not comply with prevention measures. The soldier was subsequently confirmed to have tested positive for COVID-19.\n\nThe incident prompted authorities to deploy an investigation team to Rayong Province to trace the soldier's movements. It also sparked public criticism of Prayut Chan-o-cha government, especially on social media, for allowing potentially infected foreign visitors to enter the country without adequate screening, as well as criticism of the Egyptian government after a video resurfaced showing the Egyptian soldier refusing to comply with COVID-19 testing by Thai authorities.\n\nThe Ambassador of the Arab Republic of Egypt to Thailand expressed regret for the incident and pledged that such an event would not happen again."
 thai_events.10.a: "What Egyptian soldier would be so brash as to act this way?"
 thai_events_10_texticon: ".\n\n\n\n\n£GFX_egyptian_soldier_video\n\n\n\n\n\n"

 thai_events.11.t: "Palang Pracharat Fallout and Cabinet Reshuffle"
 thai_events.11.d: "Main characters of the Palang Pracharat Party most notably the 'Four Coaches,' which included Party Leader and Minister of Finance Uttama Savanayana, Party General Secretary and Minister of Energy Sontirat Sontijirawong, Deputy Party Leader and Minister of Higher Education Suvit Maesincee, and Party Executive Committee Member Kobsak Pootrakool all announced at a press conference at Centara Grand at Central Plaza Ladprao, Bangkok, their intention to resign from the Palang Pracharat Party.\n\nMany media speculations pointed out that since the formal formation of the government in 2019, the party was faced with a series of scandals and criticism regarding the party's handling of their own background checks for MPs, and also the consolidation of the military faction within the Palang Pracharat Party. This turned out to be true as the party members met and elected General Prawit Wongsuwan as their own party leader.\n\nIn the meantime, the 'Four Coaches' group all announced their resignation from the cabinet. The Prime Minister announced the replacements, which included many people from other factions within the Palang Pracharat Party."
 thai_events.11.a: "Well... that's an entire year wasted."
 thai_events_11_texticon: "§YGeneral Prawit Wongsuwan§! assumed leadership of £GFX_palang_pracharath §PPalang Pracharath Party§!\n\n\n\n\n£GFX_SIA_PPRP1_banner\n\n\n\n\n\n"
 
 thai_events.12.t: "The Constitutional Court drops "Illuminati Case" against FFP"
 thai_events.12.d: "The Constitutional Court has delivered its ruling in what many reporters have dubbed the "Illuminati Case." The case centered on allegations that the Future Forward Party (FFP) held ideological tendencies aimed at undermining or overthrowing the democratic system with the monarchy as head of state. dismissing the case against the party, citing insufficient evidence regarding wrongdoing by the Future Forward Party or its executive committee.\n\nThe petition was filed directly with the Constitutional Court on May 15, 2019, by Nattaporn Toprayoon, a former advisor to the Chief Ombudsman. One allegation made by the petitioner was that the party's symbol when flipped resembled a triangle which is associated with the Illuminati, a Bavarian secret society founded in 1776 that promoted Enlightenment ideals of republicanism and secularism. The group was later banned by the Bavarian government, and although it became the subject of conspiracy theories about its secret global influence and efforts to establish a "New World Order," historians generally agree that it ceased to exist after its suppression in the late eighteenth century.\n\nAt the Future Forward Party headquarters, supporters cheered after the verdict was delivered. Future Forward secretary-general Piyabutr Saengkanokkul and party leader Thanathorn Juangroongruangkit later held a press conference, thanking supporters and insisting the case should never have been filed. Piyabutr stated that the FFP had no intention of undermining democracy with the monarchy as head of state, but instead sought to protect the constitutional monarchy, adding that military coups, not political parties, were responsible for weakening democracy with the monarchy as head of state.\n\nHowever, the party still faces another imminent case before the Constitutional Court, which alleges it violated laws governing political parties by accepting loans from its leader, auto-parts billionaire Thanathorn."
 thai_events.12.a: "Illuminati NOT Confirmed"
 thai_events_12_texticon: ".\n\n\n\n\n£GFX_mlg_illuminati_case\n\n\n\n\n\n"
 
 thai_events.13.t: "Demonstrations Infront of the Ministry of Energy"
 thai_events.13.d: "Protesters consisting of workers' unions led by the Thai Labour Solidarity Committee, the State Enterprises Workers' Relations Confederation, and various political groups, including the prominent group FreeYOUTH and the minor Thai Social Democratic Party, totaling more than 100 people, held a demonstration in front of the Ministry of Energy building. Many carried banners and paper-mache props of oil barrels and fuel pumps bearing slogans such as: "Oil is expensive because of hoarding by capitalists," "Return PTT to state ownership!" and "Stop! wicked capitalists, corrupt politicians, high oil prices, exploitation of the people. "\n\nThe group also submitted an open letter to Prayut Chan-o-cha, demanding the resignation of the government and the removal of the Minister of Energy, while calling for fuel price controls, refinery reform, and an end to alleged fuel hoarding. The protesters argued that the government had failed to address the fuel shortage crisis, which has affected daily life and driven up the prices of goods and electricity."
 thai_events.13.a: "Capitalist pigs hoard all the oil, as we stave!"
 thai_events_13_texticon: ".\n\n\n\n\n£GFX_ministry_of_energy_oil_protests\n\n\n\n\n\n"
 
 thai_events.14.t: "Hamtaro Mob"
 thai_events.14.d: "Hundreds of young protesters gathered for a demonstration, running around the city's Democracy Monument in circles to imitate a hamster wheel while singing to the tune of the theme song from the Japanese anime Hamtaro with modified Thai lyrics: "Their most delicious food is taxpayers money!" they sang. "Dissolve parliament! Dissolve parliament! Dissolve parliament!"\n\nA protester clutching a plush figure of Hamtaro, who gave her name as "Fah" (Sky), told to the press that the hamster-inspired protest was a way of moving away from traditional forms of demonstrating and a jab at the government that she hoped would attract attention.\n\n"Adults may think that because we're doing this, they can't take us seriously. But this is the way of the new generation," she said.\n\nAccording to The Japan Times, publishing house Shogakukan, which owns the license to Hamtaro, have declined to comment on the use of the anime in the Thai protests."
 thai_events.14.a: "Childish..."
 
 thai_events.15.t: "Harry Potter Mob"
 thai_events.15.d: "Around 200 anti-government protesters gathered at the Democracy Monument near the McDonald's Ratchadamnoen branch for a Harry Potter-themed rally titled "Cast Spells to Expel You-Know-Who." Organized by the Mahanakorn for Democracy group and students from Kasetsart University, demonstrators dressed as wizards and characters from the Harry Potter franchise, using the theme to symbolize resistance against the military-backed government.\n\nAs the event began, the first speaker, dressed as a wizard, introduced the literary work by recounting the story of Harry Potter, comparing figures in the Thai government to villains from the books and likening the Thai youth's fight for democracy to that of Harry Potter and his friends. He then concluded by asking the crowd to cast the spell "Expecto Patronum!" with their wands toward a straw effigy of Voldemort.\n\nActivist Arnon Nampa then took the stage wearing a black gown with a burgundy and gold scarf, the colors of Gryffindor, to deliver a speech questioning the role of the monarchy in Thai society. "Talking about this is not an act to topple the monarchy," Arnon said onstage to rounds of applause. "But rather to allow the monarchy to exist in Thai society in the proper way, legitimately, under a democratic constitutional monarchy. We have swept this problem under the rug for years. The real issue has been ignored, leading to ineffective solutions. We must acknowledge the reality that students and citizens are demonstrating today partly because many want to question the monarchy."\n\nThen, the demonstrators were instructed to point their wands at the constitution atop the Democracy Monument, which was likened to the Goblet of Fire, while chanting spells. Before the event ended, the host announced, "A large rally will be held soon," and the gathering concluded at 8:34 PM."
 thai_events.15.a: "Prayut is literally Lord Voldemort!"
 thai_events_15_texticon: ".\n\n\n\n\n£GFX_harry_potter_mob\n\n\n\n\n\n."
 
 thai_events.16.t: "Demonstrations in Front of the PTT Headquarters"
 thai_events.16.d: "Protesters, consisting of young activists and older laborers affiliated with various workers' unions, demonstrated in front of the PTT headquarters. They carried placards with slogans such as, "Oil is expensive because they are corrupt," "Stop supporting gas thieves," "No to PTT privatization!," and "Stop exploitation by capitalists!"\n\nThe demonstrators then gave speeches calling for PTT to be fully state-owned in order to control oil prices and prevent profiteering by private interests. They also demanded an end to alleged hoarding by capitalists and called for the resignation of Prime Minister Prayut Chan-o-cha."
 thai_events.16.a: "PTT is already state owned!"
 thai_events_16_texticon: ".\n\n\n\n\n£GFX_protests_in_front_of_ptt_hq\n\n\n\n\n\n."
 
 thai_events.17.t: "First Covid-19 Infection Case in Thailand"
 thai_events.17.d: "TNN 16 CHANNEL REPORT\n\nToday, Deputy Prime Minister and Minister of Health Anutin Charnvirakul held a press conference with a World Health Organization Representative, confirming the first COVID-19 case in Thailand and the first infection case reported outside of China. The patient, who was a tourist from China, has been hospitalized and so far recovered. Other family members close to the patient have so far not been infected.\n\nPrime Minister Prayut Chan-o-cha has been notified of the first infection case of COVID-19. The Government has confidence that the Health Agencies can detect and contain the COVID-19 situation in Thailand."
 thai_events.17.a: "Prepare for the Worse..."
 
 thai_events.18.t: "Soldier Goes Rogue, Unleashes Massacre in Korat"
 thai_events.18.d: "A horrific massacre has just occurred in Korat, Nakhon Ratchasima, when a Thai Army sergeant, enraged by a property dispute, shot and killed his commanding officer. After raiding his military base's armory, the gunman stole a Humvee and went on a rampage through the streets, firing hundreds of rounds at motorists and pedestrians. In a particularly brutal act, he fired at schoolchildren riding motorcycles, then approached to shoot them again at close range. Two responding police officers were also killed before they could even exit their vehicles.\n\nThe attacker later arrived at Terminal 21 Korat, where he opened fire on shoppers, killing 12 people. He also triggered an explosion outside the mall by shooting a gas cylinder. During the attack, he livestreamed portions of the shooting on Facebook Live and posted remorseless messages before his account was removed.\n\nPolice and soldiers eventually stormed the mall, ordering the gunman to surrender after he took hostages on the fourth floor. Instead, he continued firing, killing additional civilians and law enforcement personnel. He remained barricaded inside for several hours while authorities secured the perimeter and brought in his mother in an attempt to persuade him to surrender peacefully.\n\nFinally, after a nearly 18-hour standoff, elite Thai police and army commandos killed the attacker, ending the rampage. The tragedy left 29 people dead and 57 others wounded, marking the deadliest mass shooting by a single individual in Thai history."
 thai_events.18.a: "Such horror occurring in our country?"
 
 thai_events.19.t: "Thai Airways Face Crisis"
 thai_events.19.d: "The Thai Cabinet approved Thai Airways International's filing for bankruptcy protection with the Central Bankruptcy Court after the airline amassed roughly 240 billion baht in debt and recorded continuous losses since 2017. Instead of granting a 58.1 billion baht bailout, authorities directed the carrier to enter a court-supervised rehabilitation process to restructure its debts and continue operations.\n\nThe crisis deepened during the COVID-19 pandemic, which crippled global aviation through travel restrictions and collapsing demand. Even before the pandemic, the airline had reported a 12 billion baht loss in 2019 as passenger numbers declined. In its filing, Thai Airways cited the pandemic and rising global oil prices as key factors behind its financial deterioration.\n\nAs liquidity tightened, the government reduced its stake in the airline to below 50%, ending its status as a state enterprise. Despite earlier denying any intention to declare bankruptcy, the airline ultimately proceeded with rehabilitation. Following the Cabinet decision, Prime Minister Prayut Chan-o-cha stated to the press: "The government has reviewed all dimensions... we have decided to petition for restructuring and not let Thai Airways go bankrupt. The airline will continue to operate.""
 thai_events.19.a: "Perhaps Necessary"

 thai_events.20.t: "The Banning of Pornhub"
 thai_events.20.d: "On the evening of November 2, people in Thailand who had failed No Nut November found themselves unable to access Pornhub. When entering the site, they were met with a white page displaying a message stating, "This content has been suspended due to its illegal acts in accordance with the Computer-related Crime Act 2007 (B.E. 2550) and additional amendments and/or the Gambling Act 1935 (B.E. 2478) and additional amendments" along with the seal of the Ministry of Digital Economy and Society. \n\nThe Ministry of Digital Economy and Society justified the ban on Pornhub by citing its illegality and complaints that it disseminated obscene content, noting that a court order had been issued to suspend access to more than 191 Pornhub URLs. \n\nThe ban has met with various reactions on social media. On Twitter, Thai users trended the hashtag #SavePornhub. Many joked that they could easily bypass the ban with a VPN, that the decision would motivate gooners to join anti-government protests, that the government's ban was actually an attempt to block a scandalous video of £GFX_redacted  on the site, etc. \n\nSome have took to staging demonstrations outside the Ministry of Digital Economy and Society, holding signs (such as "DON'T HURT LONELY FOLKS BY MAKING IT INACCESSIBLE #SavePornhub" in the image below), protesting the government's decision under heavy police security."
 thai_events.20.a: " "LUAK CHUCK WAOW" - Prayut Chan-o-cha " #Stop Masterbating
 
 thai_events.21.t: "Songkran 2020 Suspended Over Pandemic Concerns"
 thai_events.21.d: "Songkran is a national festival of Thailand and a major cultural celebration that marks the beginning of the traditional solar year, characterized by people throwing water at each other amidst much fun and laughter. However, the government announced that the annual nationwide Songkran celebrations for the year 2020 would be cancelled and moved to a compensatory holiday period in July. This marked the first time in Thailand that many Songkran activities had been cancelled, as fears over the spread of the COVID-19 pandemic continued to escalate across Southeast Asia.\n\nThe public was requested to refrain from water splashing, all types of Songkran celebrations, consuming alcohol, traveling back to their hometowns, participating in large gatherings or traveling to areas at high risk of disease transmission, performing the traditional water-pouring ceremony to bless elders, and to maintain social distancing during all activities.\n\nPrime Minister General Prayut Chan-o-cha declared emergency measures following a sharp increase in confirmed infections linked to crowded entertainment districts and international tourism. Authorities warned that the traditional water festival, known for massive street gatherings, religious ceremonies, and cross-country travel, could become a "super-spreader event" capable of overwhelming the nation's healthcare system.\nCitizens expressed mixed reactions online. While some supported the government's efforts to contain the virus, others feared the loss of cultural identity and the economic devastation caused by prolonged restrictions."
 thai_events.21.a: "Safety is needed above all"
 
 thai_events.22.t: "2022 Bangkok Gubernatorial Election"
 thai_events.22.desc: "Bangkok, as a special administrative region under the Bangkok Metropolitan Administration (BMA), has its own elected governor and city council, which is elected through a democratic vote. \n\nCurrently, an election is being conducted to elect a governor. This election takes place nine years after the previous election in 2013, as no election was held during the period of military rule following the 2014 coup d'état when local government elections were suspended. NCPO leader General Prayut Chan-o-cha issued an order under Section 44 of the interim constitution allowing Sukhumbhand Paribatra to remain in office as Governor of Bangkok. However, he was later removed from office amid allegations of corruption related to the procurement of Bangkok's illuminated decorative arches.\n\nFollowing his removal, Aswin Kwanmuang, who was serving as Deputy Governor at the time, was appointed Governor of Bangkok. He is the current governor of Bangkok.\n\nThis election featured many candidates, but the five major front-runners were former Transport Minister Chadchart Sittipunt, civil engineering professor and former president of King Mongkut's Institute of Technology Ladkrabang Suchatvee Suwansawat, Move Forward Party spokesperson Wiroj Lakkhanaadisorn, former Royal Thai Air Force officer and Chairman of the Airports of Thailand Board of Directors Sita Divari, and the incumbent governor Aswin Kwanmuang. As the people of Bangkok went to the polls, they ultimately chose to elect......"
 
