 ###Startup Menu###
 SIA_country_summary: "§YCountry Summary§!:\nThailand, the “Land of Smiles,” is renowned for its culture, cuisine, and tropical beauty. But behind this globally admired image, persistent structural problems that have shaped the country`s modern history. Since the 1932 transition to a constitutional monarchy, Thailand has endured repeated cycles of political upheaval, alternating between military rule and civilian government. From World War II and the Cold War to the aftermath of the 1997 Asian financial crisis the nation has faced various instability and political upheaval \nThese tensions have intensified since the 2014 coup, with Thailand remaining under General Prayut Chan-o-cha even after the official dissolution of the military junta. Political polarization has deepened, with many becoming increasingly disillusioned with the junta-backed establishment. \nThe new decade will be a challenge for the Thai people. Will they break the cycle and progress toward a brighter future? Only time will tell." 
 SIA_country_paths: "\n\n\n§YCountry Paths§!:\n§g - United Thai Nation Party§!\n§B - Bhumjaithai Party§!\n§R - Pheu Thai Party§!\n§O - Move Forward / People's Party§!"
 SIA_country_other: "§YTips and Tricks:§!\n “...Though we Thais love peace, we will fight without fear, for none shall ever trample our freedom. We'll sacrifice every drop of our blood with every might. Glory and victory to the nation of Thailand, §RC§!h§Bai§!y§Ro!§!” \n§g - Final Stanza of the National Anthem of Thailand, Luang Saranupraphan§!"

