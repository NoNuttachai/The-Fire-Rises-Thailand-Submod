 thai_events.24.t: "£GFX_facebook_logo  Free YOUTH's post"
 thai_events.24.d: "£GFX_free_youth_header \n\nWe have 3 demands! \n\n1. "Parliament must be dissolved." - The government, under Prayut Chan-o-cha, have failed to manage the economy, particularly through its mismanagement of oil prices following the crisis in Saudi Arabia and the COVID-19 pandemic, which led to widespread unemployment and loss of income. It failed to provide comprehensive and equitable relief, neglecting to address the economic hardships faced by the people. Furthermore, it allowed VIP guests infected with the virus to enter the country without quarantine, posing a significant risk of a second major outbreak. We demand that the Prime Minister dissolve Parliament and step down to pave the way for capable individuals to solve political and economic problems.\n\n2. "Stop threatening the citizens" - Following the 2019 election, many hoped Thailand would become more democratic, with freedom of expression and assembly protected from harassment. In reality, however, physical and psychological intimidation has continued much as it did under the NCPO. National security has been used as a pretext to silence those demanding democracy and justice. We therefore demand an end to all forms of harassment and the fabrication of charges against citizens. \n\n3. "New constitution" - The current constitution, drafted by Prayut Chan-o-cha and his cronies, was designed for him and soldier-turned-politicians in power to preserve authoritarian rule under disguised as democracy. Thailand's transition to genuine democracy therefore requires the drafting of a new constitution free from interference by unelected individuals. "
 thai_events.24.a: "Down with dictatorship! Long live democracy!"
 
 thai_events.25.t: "£GFX_facebook_logo  Free YOUTH's post"
 thai_events.25.d: "£GFX_free_youth_header \n\nAnnouncing the launch of RT MOVEMENT - The One-Point Movement Team\n.\nThis is a new movement that will be unlike anything before. Awakening the class consciousness of oppressed proletarians. Whether you are a student, office worker, maid, security guard, plainclothes worker, farmer, or civil servant, "we are all oppressed proletarians"."\n.\nThis RT MOVEMENT:\n Has no leaders\n Has no stage\n Has no security guards\n Has no portable toilets\n Has no negotiations\n Has no bargaining!\n.\nJoin us in RESTART THAILAND to create a society where "the masses are equal." Please stay tuned with outlets that we will use to make this happen soon."
 thai_events.25.a: "Bruh"
 
 thai_events.26.t: "£GFX_facebook_logo  Free YOUTH's post"
 thai_events.26.d: "£GFX_free_youth_header \n\nAfter October 21st, lovers of democracy gave Prayut three days to sign his resignation. Now, three days have passed, and Prayut shows no sign of resigning. Since talking to the dog is pointless, we'll talk to the "dog's owner."\n\nVery brave, very good, to disregard the people!\nVery brave, very good. to refuse to return to the path of democracy! Since he's shown his true colors, there's nothing left to lose but the shackles that hold this country back.\n\nThis Monday, October 26th, at 5:00 PM! Please be prepared. We will march from Samyan Intersection to the German Embassy. More details to follow. Thank you, and see you there"
 thai_events.26.a: "Und weil der Mensch ein Mensch ist..."
 
 thai_events.27.t: "March to the German Embassy: 26th October Mob"
 thai_events.27.d: "At 17:00, protesters and organizers began gathering in front of the Samyan Mitrtown shopping mall, then marched along Rama IV Road before turning right onto South Sathorn Road toward the German Embassy.\n\nPolice set up metal barricades and deployed three lines of riot police to block the entrance in front of the embassy building, keeping several companies of officers on standby to secure the perimeter.\n\nThe protesters goal is to submit a letter to the German Ambassador to Thailand, Georg Schmidt, to be forwarded to the German government. The letter requested an investigation into the exercise of royal power by the Thai monarch within German territory. A representative of the protesters also read a statement in three languages: Thai, English, and German.\n\nIn the wake of the demonstration, Prime Minister Prayut Chan-o-cha announced that the government would enforce "all laws" against the demonstrators, and authorities intensified legal actions. Ultimately, 13 key protesters involved in the rally were jointly indicted on charges under both Section 112 (lèse-majesté) and Section 116 (sedition) of the Criminal Code."
 thai_events.27.a: "Einigkeit und Recht und Freiheit!"

