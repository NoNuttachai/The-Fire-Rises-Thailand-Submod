 # Party Detail Panels
 SIA_parliament_detail_pprp_name: "£GFX_palang_pracharath §YPalang Pracharath Party§! (Phak Palang Pracharath)"
 SIA_parliament_detail_pprp_leader: "Party Leader: §YGeneral Prawit Wongsuwan§!"
 SIA_parliament_detail_pprp_desc: "§YPalang Pracharath Party§! is a Thai political party founded in 2018 to support the continuation of General Prayut Chan-o-cha`s government following the planned 2019 elections. Widely regarded as the political arm of the military establishment, the party drew its core support from conservative voters, the military, and business elites.\n\nThe party`s core platform focuses on §Ynational stability, economic development under strong leadership, and continuity§! of the policies enacted under the NCPO. Despite criticism for its close ties to the junta, Palang Pracharath emerged as the largest party in the 2019 election by popular vote, forming a coalition government that returned Prayut to the premiership."

 SIA_parliament_detail_ptp_name: "£GFX_phua_thai §YPheu Thai Party§! (Phak Pheu Thai)"
 SIA_parliament_detail_ptp_leader: "Party Leader: §YSompong Amornvivat§!"
 SIA_parliament_detail_ptp_desc: "§YPheu Thai Party§! is a Thai political party founded in 2008 following the dissolution of the People Power Party, with the aim of continuing the political ideology and mass support base of the Thai Rak Thai Party.\n\nThe party`s core platform focuses on §Yreducing social inequality, stimulating economic growth, and improving the quality of life§! for the general public. Pheu Thai has played a major role in Thai politics, having formed governments on several occasions, and has been led by prominent political figures such as §YThaksin Shinawatra§! and §YYingluck Shinawatra§!, making it one of the most influential political parties in contemporary Thailand."

 SIA_parliament_detail_ffp_name: "£GFX_orange_party_1 §YFuture Forward Party§! (Phak Anakhot Mai)"
 SIA_parliament_detail_ffp_leader: "Party Leader: §YThanathorn Juangroongruangkit§!"
 SIA_parliament_detail_ffp_desc: "§YFuture Forward Party§! is a Thai political party founded in 2018 by billionaire auto-parts heir Thanathorn Juangroongruangkit. The party quickly gained massive support among younger Thais and progressives, campaigning on §Ydemocratic reform, anti-military intervention in politics, decentralization, and economic modernization§!.\n\nIn the 2019 election, the FFP won 53 seats, making it the third-largest party. However, the party faced constant legal challenges and was ultimately dissolved by the Constitutional Court in February 2020, with its executives banned from politics for 10 years."

 SIA_parliament_detail_dp_name: "£GFX_democrat §YDemocrat Party§! (Phak Prachathipat)"
 SIA_parliament_detail_dp_leader: "Party Leader: §YJurin Laksanawisit§!"
 SIA_parliament_detail_dp_desc: "§YDemocrat Party§! is Thailand`s oldest political party, founded in 1946. Traditionally representing the urban middle class, professionals, and southern Thai voters, the party has long positioned itself as a champion of §Yconstitutionalism, rule of law, and liberal democratic values§!.\n\nDespite its historical prominence, the party`s influence has waned in recent elections. In 2019, it joined the Palang Pracharath-led government coalition, a controversial decision that cost it support among its progressive base."

 SIA_parliament_detail_bjt_name: "£GFX_bhumjaithai §YBhumjaithai Party§! (Phak Phumchai Thai)"
 SIA_parliament_detail_bjt_leader: "Party Leader: §YAnutin Charnvirakul§!"
 SIA_parliament_detail_bjt_desc: "§YBhumjaithai Party§! is a Thai political party founded in 2008. Under the leadership of Anutin Charnvirakul, the party has carved out a niche focusing on §Ypragmatic populism, rural development, and public health reform§!.\n\nNotably, Bhumjaithai became the first party in Thailand to champion the legalization of cannabis for medical and economic purposes. The party joined the government coalition after the 2019 election, securing key cabinet positions including the Ministry of Public Health."

 SIA_parliament_detail_tlp_name: "£GFX_thai_liberal_party §YThai Liberal Party§! (Phak Seri Ruam Thai)"
 SIA_parliament_detail_tlp_leader: "Party Leader: §YSereepisuth Temeeyaves§!"
 SIA_parliament_detail_tlp_desc: "§YThai Liberal Party§! is a minor Thai political party led by former national police chief Sereepisuth Temeeyaves. The party positions itself as a §Yliberal, reformist party§! advocating for police reform, anti-corruption measures, and civil liberties.\n\nIn the 2019 election, the party won 10 seats and aligned with the opposition bloc."

 SIA_parliament_detail_ctpp_name: "£GFX_chartthaipattana §YChart Thai Pattana Party§! (Phak Chart Thai Pattana)"
 SIA_parliament_detail_ctpp_leader: "Party Leader: §YKanchana Silpa-archa§!"
 SIA_parliament_detail_ctpp_desc: "§YChart Thai Pattana Party§! is a Thai political party that emerged from the dissolution of the original Chart Thai Party. Led by the Silpa-archa political family, the party maintains a §Yconservative, business-oriented platform§! with strong support in central Thailand.\n\nThe party joined the government coalition after the 2019 election, contributing 10 seats to the ruling majority."

 SIA_parliament_detail_pcc_name: "£GFX_prachachat §YPrachachat Party§! (Phak Prachachat)"
 SIA_parliament_detail_pcc_leader: "Party Leader: §YWan Muhamad Noor Matha§!"
 SIA_parliament_detail_pcc_desc: "§YPrachachat Party§! is a Thai political party founded in 2018, primarily representing the §YMuslim-majority provinces in southern Thailand§!. Led by veteran politician Wan Muhamad Noor Matha, the party focuses on issues affecting the Deep South, including §Ypeace and reconciliation, cultural rights, decentralization, and economic development§! in the border provinces.\n\nIn the 2019 election, the party won 7 seats, all from southern constituencies, and aligned with the opposition."

