 SIA_raise_our_three_fingers: "Raise our Three Fingers"
 SIA_raise_our_three_fingers_desc: "The government's decision to dissolve §Othe Future Forward Party§! opened the eyes of an entire generation of young Thais to the reality of authoritarian rule and a political system stacked against them. Unlike previous generations, they are not willing to accept things simply because "that is the way they have always been." These young people are standing up to challenge the status quo and demand real change. They will §Omove forward§! with the §Opeople§! in the pursuit of democracy. Our voices cannot be ignored, and our three fingers will be raised!."
 SIA_raise_our_three_fingers_tt: "Side with the §YGovernmental Opposition§! to §Roust§! §BPrayut Chan-o-cha§! from power."
 
