 SIA_found_top_news: "Launch Top News"
 SIA_found_top_news_desc: "Former staff and journalists of Nation TV, led by Sonthiyan Chuenruthainaitham, have founded the television news channel Top News. The group had previously departed Nation TV over objections to a management shift that planned to pivot the channel away from its staunchly pro-Prayut, royalist, and anti-protestor positioning. This change in management followed heavy criticism and an advertising boycott by protestors over the network's coverage of the demonstrations."

 SIA_utilize_pegasus_against_key_agitators: "Utilize Pegasus Spyware Against Key Agitators"
 SIA_utilize_pegasus_against_key_agitators_desc: "\n\n\n\n£GFX_SIA_Pegasus_Spyware_Banner\n\n\n\n\n\nPegasus is a military-grade spyware developed by the Israeli cyber-arms company NSO Group and the Israeli Ministry of Defense. It is designed to be covertly and remotely installed on mobile phones running iOS and Android. Israel markets Pegasus as a product for "fighting crime and terrorism," (Nudge nudge, wink wink) It is used by governments agencies around the world to monitor “those who pose a threat” to “national security” with Thailand being one of them."
 
 SIA_cyber_warfare_with_the_three_hooves: "Cyber Warfare With The Three Hooves"
 SIA_cyber_warfare_with_the_three_hooves_desc: "Our agents will use sock puppet accounts on social media sites such as Twitter and Facebook to attack the opposition, revealing and disseminating negative information about the government opponents."
 
 SIA_jay_juk_khlong_sam: "Jay Juk Khlong Sam"
 SIA_jay_juk_khlong_sam_desc: "\n\n\n\n£GFX_SIA_Jae_Juk\n\n\n\n\n\nOur agents will create a Twitter account named 'Jay Juk Khlong Sam' (Sister Juk of Canal Sam), featuring a profile picture of Charlotte Linlin from the anime One Piece (chosen simply because one of our agents likes the show). This account will be used to post content opposing the three-finger protesters."
 
 SIA_botted_engagement_on_the_rco_facebook_page: "Botted Engagement on the RCO Facebook Page"
 SIA_botted_engagement_on_the_rco_facebook_page_desc: "\n\n\n\n£GFX_SIA_RCO_Facebook\n\n\n\n\n\nOur agents will use bots to drive engagement on the Facebook page of the royalist Rubbish Collection Organization."
 
 SIA_demonstrate_infront_of_the_ministry_of_energy: "Demonstrate Infront of the Ministry of Energy"
 SIA_demonstrate_infront_of_the_ministry_of_energy_desc: "We will organize a demonstration against the Ministry of Energy in cooperation with workers' unions and student activist groups in front of the Ministry of Energy headquarters in Bangkok, demanding immediate action to address the worsening fuel crisis."
 
 SIA_demonstrate_infront_of_the_ptt_headquarters: "Demonstrate Infront of the PTT Headquarters"
 SIA_demonstrate_infront_of_the_ptt_headquarters_desc: "We will organize a demonstration against PTT Public Company Limited, urging the company to prioritize the public interest over corporate profits during this period of economic hardship."
 

