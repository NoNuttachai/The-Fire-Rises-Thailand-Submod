 hybrid_regime_SIA: "Stratocratic Conservatism"
 SIA_hybrid_regime_desc: "\n\n\n\n£GFX_stratocratic_conservatism\n\n\n\n\n\n§YStratocratic Conservatism§! follows the idea that a strong figure from the military can ensure stability within the country and is essential to maintaining national unity and safeguarding tradition, placing strong emphasis on the nation, religion and monarchy.\n\nA stratocratic conservative government differs from a military junta or an outright dictatorship in that democratic institutions are retained to legitimize authority and maintain public participation, but they are still skewed to serve the government"

 ###Characters###
 SIA_rama_x_char_desc: "General Prayut Chan-o-cha, commonly known as "Big Tu", was born into a military family, a background that led him into a career in the armed forces. He became well known within the 21st Infantry Regiment of the King's Guard as the "Queen's Tiger", a reputation that contributed to his rise to Commander-in-Chief of the Royal Thai Army in 2010, a position he had long aspired to attain.\n\nDuring the political turmoil of 2014, marked by deep divisions and prolonged unrest, Prayut led the military under the National Council for Peace and Order (NCPO) in a coup on 22 May 2014, aiming to end the political crisis. This action resulted in his appointment as Prime Minister.\n\nAs Prime Minister, Prayut oversaw the drafting of a new constitution focused on national unity and anti-corruption, earning it the nickname "the anti-corruption constitution", though several provisions—such as allowing a non-MP to become Prime Minister and empowering the Senate—were controversial.\n\nAfter the 2019 general election, Prayut returned to office with the support of the Palang Pracharath Party, promoting policies to assist low-income citizens, reduce living costs, and address agricultural issues. Despite continued criticism from younger and left-wing groups over the constitution and his rule, he retained strong support from conservative groups as a stabilizing leader."
 SIA_prayut_chan-o-cha_char_desc: "General Prayut Chan-o-cha, commonly known as `Big Tu,` was born into a military family, a background that led him into a career in the armed forces. He became well known within the 21st Infantry Regiment of the King's Guard as the `Queen's Tiger,` a reputation that contributed to his rise to Commander-in-Chief of the Royal Thai Army in 2010, a position he had long aspired to attain.\n\nDuring the political turmoil of 2014, marked by deep divisions and prolonged unrest, Prayut led the military under the National Council for Peace and Order (NCPO) in a coup on 22 May 2014, aiming to end the political crisis. This action resulted in his appointment as Prime Minister.\n\nAs Prime Minister, Prayut oversaw the drafting of a new constitution focused on national unity and anti-corruption, earning it the nickname `the anti-corruption constitution,` though several provisions—such as allowing a non-MP to become Prime Minister and empowering the Senate—were controversial.\n\nAfter the 2019 general election, Prayut returned to office with the support of the Palang Pracharath Party, promoting policies to assist low-income citizens, reduce living costs, and address agricultural issues. Despite continued criticism from younger and left-wing groups over the constitution and his rule, he retained strong support from conservative groups as a stabilizing leader."
