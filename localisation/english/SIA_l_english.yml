 SIA_petrol_demonstrations: "Petrol Demonstrations"
 SIA_petrol_demonstrations_desc: "Everyday people are being squeezed dry by a wealthy few who control the oil industry, while families and workers bear the crushing burden of rising living costs. We will organize protests over skyrocketing fuel prices, as they are not just about the cost of gas, they are a natural human reaction to economic hardship and a system that prioritizes corporate profits and capitalist interests over the well-being of ordinary people."
 
