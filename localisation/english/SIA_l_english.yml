 SIA_protests_category: "Anti Government Protests"
 SIA_protests_category_desc: "\n\n\n\n\n£GFX_SIA_protest_banner\n\n\n\n\n\n\n\nThe Constitutional Court's dissolution of the Future Forward Party sparked widespread outrage, particularly among younger Thais who saw it as an attempt to suppress political opposition. Combined with growing dissatisfaction with the government, the ruling triggered a wave of political activism and demonstrations.\n\nLed primarily by students and young people, with support from some labor unions and opposition parties, the movement is highly decentralized, relying on social media to organize events, share information, and coordinate actions.\n\nCurrent §OIntensity§! of the Protests: \n§O[SIA_protest_status]§!\n\nCurrently we are supporting: [SIAGetSideSupported]"
