 #HOG
 SIA_hog_prayut_chan: "Prime Minister: §HPrayut Chan-o-cha§!\n\n\n\n\n\n\n\n   £GFX_SIA_hog_prayut_chan_por\n\n\n\n\n\n\n\n\n-------------------------------------\n§gGeneral Prayut Chan-o-cha, commonly known as "Big Tu," was born into a military family, a background that led him into a career in the armed forces. He became well known within the 21st Infantry Regiment of the King's Guard as the "Queen's Tiger," a reputation that contributed to his rise to Commander-in-Chief of the Royal Thai Army in 2010, a position he had long aspired to attain.\n\nDuring the political turmoil of 2014, marked by deep divisions and prolonged unrest, Prayut led the military under the National Council for Peace and Order (NCPO) in a coup on 22 May 2014, aiming to end the political crisis. This action resulted in his appointment as Prime Minister.\n\nAs Prime Minister, Prayut oversaw the drafting of a new constitution focused on national unity and anti-corruption, earning it the nickname `the anti-corruption constitution,` though several provisions—such as allowing a non-MP to become Prime Minister and empowering the Senate—were controversial.\n\nAfter the 2019 general election, Prayut returned to office with the support of the Palang Pracharath Party, promoting policies to assist low-income citizens, reduce living costs, and address agricultural issues. Despite continued criticism from younger and left-wing groups over the constitution and his rule, he retained strong support from conservative groups as a stabilizing leader.§!"
 SIA_prawit_wongsuwan_hog: "Acting Prime Minister: §HPrawit Wongsuwan§!\n\n\n\n\n\n\n\n   £GFX_hog_SIA_prawit_wongsuwan\n\n\n\n\n\n\n\n\n-------------------------------------\n§gGeneral Prawit Wongsuwan, nicknamed "Big Pom," is a former Commander-in-Chief of the Royal Thai Army and Minister of Defence, and is one of the most prominent military and political figures in modern Thai history.\n\nBorn into a military family, Prawit Wongsuwan is the son of Major General Prasert Wongsuwan and has four younger brothers. A graduate of the Chulachomklao Royal Military Academy, Class 17, he began his career in the 21st Infantry Regiment (Queen's Guard), where he forged close ties with Generals Prayut Chan-o-cha and Anupong Paochinda. Together, the trio became known as the "Three Ps" (3 Pores), a powerful military faction that played a significant role in Thai politics, including the 2010 crackdown on Red Shirt protests and the 2014 military coup.\n\nDespite his long career, Prawit has been involved in several controversies that have damaged his public image. The most notable was the luxury watch scandal, in which he was found wearing numerous undeclared high-end watches worth tens of millions of baht. Prawit maintained that the watches had been borrowed from a deceased friend, an explanation that drew ridicule and was heavily memed upon on the Thai internet.\n\nHis tenure as Deputy Prime Minister and a senior figure within the military government also attracted criticism. Additional controversies included allegations surrounding the Rajabhakti Park project, concerns over the selection process for the 2018 Senate, and accusations that the Five Provinces Bordering Forest Preservation Foundation improperly benefited from land originally designated under the Sor Por Kor 4-01 land reform program. These issues have contributed to Prawit's reputation as one of Thailand's most controversial political figures.§!"
 
