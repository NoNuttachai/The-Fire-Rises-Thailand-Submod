 #HOG
 SIA_hog_prayut_chan: "Prime Minister: §HPrayut Chan-o-cha§!\n\n\n\n\n\n\n\n   £GFX_SIA_hog_prayut_chan_por\n\n\n\n\n\n\n\n\n-------------------------------------\n§gGeneral Prayut Chan-o-cha, commonly known as "Big Tu," was born to an army colonel father and a schoolteacher mother, a background that led him into a career in the armed forces. He pursued a military career from a young age, graduating from the Armed Forces Academies Preparatory School (Class 12) and the Chulachomklao Royal Military Academy (Class 23). He rose through the ranks within the 21st Infantry Regiment of the King's Guard, known as the "Queen's Tigers," a reputation that contributed to his rise to Commander-in-Chief of the Royal Thai Army in 2010.\n\nDuring Thailand's political turmoil in 2014, Prayut led the National Council for Peace and Order (NCPO) in a coup on May 22, 2014, seizing power and becoming Prime Minister. He oversaw a new constitution, approved in a 2016 referendum and promulgated in 2017, which drew controversy over provisions allowing a non-MP to become Prime Minister and empowering the appointed Senate.\n\nFollowing the dissolution of the military government in 2019, Prayut returned to office as Prime Minister with the backing of the Palang Pracharath Party following the 2019 general election. Despite continued criticism from youth-led and pro-democracy groups over the 2017 constitution and his extended rule, he retained support from conservative factions who viewed him as a stabilizing leader.§!"
 SIA_prawit_wongsuwan_hog: "Acting Prime Minister: §HPrawit Wongsuwan§!\n\n\n\n\n\n\n\n£GFX_hog_SIA_prawit_wongsuwan\n\n\n\n\n\n\n\n\n-------------------------------------\n§gBorn into a military family, Prawit Wongsuwan is the son of Major General Prasert Wongsuwan and has four younger brothers, including former national police chief Patcharawat Wongsuwan. A graduate of the Chulachomklao Royal Military Academy (Class 17), he began his career in the 21st Infantry Regiment (Queen's Guard), where he forged close ties with Generals Prayut Chan-o-cha and Anupong Paochinda. Together, the trio became known as the "3 Por" faction, derived from the initials of their names, a powerful military clique originating from the Burapha Payak (Tigers of the East) that played a central role in Thai politics, including the 2010 crackdown on the Red Shirt protests and the 2014 military coup.\n\nDuring his tenure as Deputy Prime Minister and Minister of Defence under the military government, Prawit acted as a political strategist and key power broker. In June 2020, Prawit assumed the leadership of the ruling Palang Pracharath Party (PPRP)\n\nDespite his long career, Prawit has been involved in several controversies that have damaged his public image. The most notable was the luxury watch scandal, in which he was found wearing numerous undeclared high-end watches worth tens of millions of baht. Prawit maintained that the watches had been borrowed from a deceased friend, an explanation that drew ridicule and was heavily memed upon on the Thai internet.§!"
 SIA_sretta_thavisin_hog: "Prime Minister: §HSretta Thavisin§!\n\n\n\n\n\n\n\n   £GFX_hog_SIA_sretta_thavisin\n\n\n\n\n\n\n\n\n-------------------------------------\n§gSrettha Thavisin was born on 15 of February 1962, into a wealthy family of Captain Amnuay Thavisin and Chodchoi Jutrakul. In 1988, he co-founded Sansiri, a venture that propelled him to become a billionaire and a leading real estate tycoon within his country.\n\nSrettha’s economic policies is aimed at stimulating the Thai economy, particularly in Thailand’s tourism sector, by promoting Thai soft power. He aims to promote the implementation of a digital wallet scheme, and his international visits were aimed at attracting investors.\n\nSrettha was, however, labelled as a “puppet” under the control of powers behind the throne by the orange shirts during the 2013–2014 Thai political crisis. Srettha expressed opposition to the People’s Democratic Reform Committee. Following the 2014 coup, he complied with a summons from the National Council for Peace and Order, reporting to the Royal Thai Army auditorium.\n\nSrettha announced his intention to join the Pheu Thai Party. In the general elections, Srettha was elected as the 30th Prime Minister of Thailand, following a nomination by the Pheu Thai Party.§!"
 SIA_paetongtarn_shinawatra_hog: "Prime Minister: §HPaetongtarn Shinawatra§!\n\n\n\n\n\n\n\n   £GFX_hog_SIA_paetongtarn_shinawatra\n\n\n\n\n\n\n\n\n-------------------------------------\n§gPaetongtarn Shinawatra is the daughter of Thai politician and 23rd Prime Minister of Thailand, Thaksin Shinawatra. She was born on 21 August 1986 as the youngest child of Thaksin. Referred to by the media and the public by the nickname “Ung-Ing,” she graduated from Chulalongkorn University and the University of Surrey before beginning a career in business and later following her father’s footsteps into politics.\n\nIn 2021, Paetongtarn became involved in the Pheu Thai Party and was appointed as the party’s chief adviser on public participation and innovation. She later became increasingly prominent within the party, particularly during the lead-up to the 2023 general election. Her political prominence is also closely associated with the Shinawatra family’s influence within Pheu Thai and its predecessor parties.\n\nPaetongtarn was officially nominated as one of the three candidates for prime minister of the Pheu Thai Party in the general election, alongside Srettha Thavisin and Chaikasem Nitisiri. Following the election, she was elected Prime Minister of Thailand, becoming the country’s youngest prime minister to date and the third member of the Shinawatra family to serve as Prime Minister, after her father, Thaksin Shinawatra, and her aunt, Yingluck Shinawatra.§!"
