 SIA_pirapan_salirathavibhaga_hog: "Prime Minister: §HPirapan Salirathavibhaga§!\n\n\n\n\n\n\n\n   £GFX_hog_SIA_pirapan_salirathavibhaga\n\n\n\n\n\n\n\n\n-------------------------------------\n§gPirapan Salirathavibhaga was born on February 21, 1959, into a wealthy aristocratic family in Bangkok. His father, grandfather, and even his great-grandfather were all either high-ranking military officers or judges.\n\nAt the age of 37, he began his political career as an MP representing the Phaya Thai District, an area where his family owned significant amounts of land. He entered politics under the Democrat Party, alongside Abhisit Vejjajiva and Tharin Nimmanhaemin, following the general election in late 1996. Following the resignation of former Prime Minister Abhisit Vejjajiva due to the party's poor election results, the Democrat Party held a vote for a new leader in May 2019. Pirapan ran for the top position but lost the leadership contest to Jurin Laksanawisit.\n\nPirapan finally had enough of this so he resigned from the Democratic Party. Following his resignation, he took on the role of an adviser to Prime Minister Prayut Chan-o-cha. He finally joined the newly formed United Thai Nation Party in March 2020.\n\nHe currently serves as the Minister of Energy and Prime Minister of Thailand, alongside his position as the leader of the United Thai Nation Party.§!"
