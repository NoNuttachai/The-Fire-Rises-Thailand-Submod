l_english:
 bangkok_thai_submod: "Bangkok"
 bangkok_thai_submod_desc: "----\n§9Bangkok, known in Thai as “Krungthep Maha Nakhon” with a ceremonial name of 168 letters (Latin transliteration) is the capital and largest city of Thailand, with over ten million residents and millions more living in the surrounding provinces of Bangkok metropolitan region (Krungthep Parimonthon).\n\nBangkok reflects a unique blend of Thai tradition and modernity, combining modern skyscrapers with historic cultural landmarks. It regularly ranks among the world's most visited cities, welcoming between 25 and 40 million international tourists each year. As the seat of the national government, Bangkok is distinct from Thailand's other provinces and, alongside Pattaya, operates as a special administrative area. The capital is governed by the Bangkok Metropolitan Administration, led by an elected governor who serves a four-year term alongside a local city council.§!"
 
 nonthaburi: "Nonthaburi"
 nonthaburi_desc: "----\n§9Nonthaburi is a random city that's just actually part of Bangkok§!"
 
 pattaya: "Pattaya"
 pattaya_desc: "----\n§9Pattaya originated as a small fishing village in Chonburi Province. The village transformed dramatically during the Vietnam War as American GIs, through word of mouth, began using it for rest and recreation (R&R). To accommodate the growing number of American servicemen, the former fishing village quickly developed a thriving tourism industry. Hotels, restaurants, entertainment venues, and other tourist facilities soon emerged along its shores.\n\nThe American withdrawal from Indochina in the mid-1970s did not end Pattaya’s tourism industry. Its beautiful coastline and beaches quickly attracted visitors from around the world. With Pattaya’s growing popularity, a major construction boom soon brought high-rise condominiums, shopping centers, and skyscrapers.\n\nToday, the city of Pattaya attracts millions of domestic and international tourists, greatly contributing to Thailand’s economy and becoming well known worldwide as a prime beach vacation destination.\n\nAlongside Bangkok, Pattaya is a special administrative area of Thailand, governed by the Pattaya City Administration and led by an elected mayor who serves a four-year term alongside a local city council.§!"
 
 ayutthaya: "Ayutthaya"
 ayutthaya_desc: "----\n§9Phra Nakhon Si Ayutthaya Province, or simply Ayutthaya, was the former capital of the Ayutthaya Kingdom in modern-day Thailand, founded in 1350. For over four centuries, it flourished as one of the world’s most prosperous international trading hubs and served as the capital of the kingdom, attracting merchants from across Asia and Europe. The fall of the kingdom in 1767, following a devastating Burmese invasion, left behind ancient stone ruins of reliquary towers (prangs), sprawling temple complexes, crumbling monasteries, and weathered Buddha statues scattered across the former capital.\n\nToday, these ruins form the Ayutthaya Historical Park, designated as a UNESCO World Heritage Site and one of Thailand’s most important historical and cultural attractions. The presence of the Lopburi and Pa Sak rivers, along with the Chao Phraya River, makes the province a major rice-farming area. Ayutthaya remains an important agricultural and industrial center, while its ancient temples and ruins attract tourists from across Thailand and around the world.§!"
 
