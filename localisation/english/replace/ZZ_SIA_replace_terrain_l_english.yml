 hat_yai: "Hat Yai"
 hat_yai_desc: "----\n§9Hat Yai is the largest city in Southern Thailand and is part of the greater Hat Yai–Songkhla Metropolitan Area, a vibrant blend of Thai, Thai-Chinese, and Thai-Muslim cultures. Located near the Malaysian border, Hat Yai developed rapidly during the 20th century. Its strategic location helped transform it from a small settlement into a major regional trading center, particularly following the expansion of the railway connecting southern Thailand with Malaysia.\n\nFor many, thinking of Hat Yai immediately brings to mind its most famous dish: Hat Yai fried chicken. Known for its crispy, golden-brown skin and savory flavor, it is traditionally served with sticky rice, fried shallots, and sweet chili sauce a favorite enjoyed throughout Thailand and neighboring Malaysia.§!"