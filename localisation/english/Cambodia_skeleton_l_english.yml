 Thai_Cambodia_Report.1.t: "Diplomat Rotation"
 Thai_Cambodia_Report.1.d: "Excerpt from Royal Thai Embassy in Phnom Penh:\n\nMr. Cherdkiat Atthakor, Ambassador of Thailand to Cambodia, paid a farewell visit to Samdech Akka Moha Sena Padei Techo HUN SEN, Acting Head of State and President of the Cambodian Senate. The visit marked the occasion of the Ambassador's end of his mission in Cambodia.\n\nDuring the meeting, both sides emphasised on strong and close relations between Thailand and Cambodia in all areas, which has now been elevated to a strategic partnership. The discussion covered various issues of mutual interests and benefits such as bilateral trade, investment, cultural linkage, tourism promotion, partnership for development and cooperation in regional frameworks i.e. ACMECS and ASEAN" 
 Thai_Cambodia_Report.1.a: "Acknowledged"
 SIA_Ambassador_Replacement: "§g§BCherdkiat Atthakor§! will be replaced by §BTull Traisorat§!§!"
 Thai_Cambodia_Report.2.t: "New Ambassador"
 Thai_Cambodia_Report.2.d: "Excerpt from Royal Thai Embassy in Phnom Penh:\n\nMr. Tull Traisorat presented the Letter of Credence to Samdech Akka Moha Sena Padei Techo Hun Sen, Acting Head of State of Cambodia, accrediting him as the Ambassador Extraordinary and Plenipotentiary of the Kingdom of Thailand to the Kingdom of Cambodia.\n\nThe Ceremony took place at the Senate House. Samdech Akka Moha Sena Padei Techo Hun Sen commended the close cooperation at all levels between Thailand and Cambodia while Ambassador Traisorat is honoured to assume his post during the special year of the 75th anniversary of the diplomatic relations between Thailand and Cambodia.\n\nHe reaffirmed his commitment to further enhance Thai-Cambodian relations in all dimensions and all sectors - government, private sector, and people-to-people." 
 Thai_Cambodia_Report.2.a: "Acknowledged"
 