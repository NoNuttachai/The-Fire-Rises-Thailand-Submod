 THA_opposition_management_name:0 "Management of Public Discontent"
 THA_crackdown_on_protests_name:0 "Crackdown on Student Protests"
 THA_crackdown_on_protests_desc:0 "The youth are getting restless. A show of force by the Royal Thai Police will remind them who is in charge, though it may damage our international standing."
 THA_concede_to_demands_name:0 "Negotiate with Protest Leaders"
 THA_concede_to_demands_desc:0 "By meeting some of the minor demands regarding constitutional reform, we can temporarily sap the momentum of the movement at the cost of our own authority."
